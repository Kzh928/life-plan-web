<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5ef"><title>ごはんの手帖</title><style>
:root{--bg:#f7f5ef;--paper:#fffefa;--ink:#283b32;--muted:#7b837a;--line:#dfE3d7;--green:#365d45;--light:#eaf0e3;--orange:#b76b3c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 -apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans',sans-serif}button,input,textarea,select{font:inherit}button,a,input,textarea,summary{touch-action:manipulation}button{cursor:pointer}button,.btn{border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:10px 15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}button:hover,.btn:hover{background:var(--light)}button.primary,.btn.primary{background:var(--green);color:white;border-color:var(--green)}button.small{padding:5px 10px;font-size:13px}button.danger{color:#a63f35}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #c18d49;outline-offset:3px}h1,h2,h3,p{margin-top:0}h1{font-family:Georgia,'Yu Mincho',serif;font-size:42px;line-height:1.4;letter-spacing:.06em;font-weight:500}h2{font-size:22px;font-weight:600}h3{font-size:17px}small,.muted{color:var(--muted)}.top{height:80px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;background:#f7f5eff5;z-index:9;gap:12px}.brand{font-family:'Yu Mincho',serif;display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;letter-spacing:.1em;color:var(--ink);background:none;border:0;padding:0}.mark{width:34px;height:34px;display:grid;place-content:center;background:var(--green);color:white;border-radius:50%;font-size:18px}.topnav{display:flex;gap:8px;align-items:center}.topnav button{background:none;border:0}.topnav button.active{background:var(--light)}main{max-width:1180px;margin:auto;padding:42px 30px 90px}.eyebrow{font-size:11px;letter-spacing:.21em;color:var(--green);font-weight:700;margin-bottom:16px}.hero{display:grid;grid-template-column border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#78836c;background:transparent}.addcard .plus{font-size:35px;font-weight:200}.addcard p{font-size:12px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px;margin:18px 0}.soft{background:var(--light);border-radius:10px;padding:15px 18px}.warning{background:#fcf1dd;border-radius:9px;padding:13px 16px;color:#8a602c;font-size:13px}.back{background:none;border:0;padding-left:0;margin-bottom:20px}.detailhero{display:grid;grid-template-columns:1fr 1fr;gap:35px;align-items:center}.detailhero .cover{height:310px;border-radius:14px}.detailhero h1{font-size:32px;margin:10px 0 16px}.detailgrid{display:grid;grid-template-columns:320px 1fr;gap:30px;margin-top:27px}.detailgrid .panel{margin-top:0}.variants{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.variant.active{background:var(--green);color:white}.ingredients{list-style:none;padding:0;margin:15px 0}.ingredients li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}label.check{display:flex;gap:9px;align-items:flex-start;cursor:pointer}.check input{accent-color:var(--green);margin-top:8px}.step{border:1px solid var(--line);background:var(--paper);border-radius:12px;margin-bottom:12px;overflow:hidden}.step summary{padding:19px;cursor:pointer;display:flex;align-items:center;gap:13px;list-style:none}.step summary::-webkit-details-marker{display:none}.num{width:30px;height:30px;flex-shrink:0;display:grid;place-content:center;border-radius:50%;background:var(--light);color:var(--green);font-size:13px}.step summary:after{content:'＋';margin-left:auto;color:var(--green)}.step[open] summary:after{content:'−'}.stepbody{padding:0 22px 22px 62px;white-space:pre-wrap}.stepbody img{display:block;width:100%;max-height:300px;object-fit:cover;border-radius:9px;margin-bottom:14px}.tip{font-size:13px;border-left:3px solid #cfb57e;padding-left:12px;margin:15px 0}.sectiontitle{font-family:'Yu Mincho',serif;margin:28px 0 15px}.field{display:flex;flex-direction:column;gap:6px;margin:15px 0}.field label{font-size:13px;font-weight:600}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 12px;color:var(--ink)}textarea{min-height:95px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 25px}.wide{grid-column:1/-1}.help{font-size:12px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);padding:25px;width:min(680px,calc(100% - 24px));max-height:90dvh}dialog::backdrop{background:#23382d77;backdrop-filter:blur(4px)}dialog h2{font-family:'Yu Mincho',serif;margin-bottom:5px}.modalhead{display:flex;justify-content:space-between;align-items:center}.editor{max-width:850px;margin:auto}.ingredientEdit{display:grid;grid-template-columns:1.4fr .65fr .65fr auto;gap:8px;margin:8px 0}.ingredientEdit input,.ingredientEdit select{width:100%;min-width:0;padding:8px;border:1px solid var(--line);border-radius:6px}.ingredientEdit .mode{grid-column:1/4;font-size:12px}.stepedit{border:1px solid var(--line);border-radius:9px;padding:18px;margin:15px 0}.empty{text-align:center;padding:50px 20px;color:var(--muted)}.footer{margin-top:44px;border-top:1px solid var(--line);padding-top:18px;font-size:12px;color:var(--muted)}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;z-index:100;padding:12px 22px;border-radius:12px;max-width:90%;display:none}.stickyactions{position:sticky;bottom:12px;display:flex;justify-content:flex-end;gap:10px;background:#f7f5eff0;padding:12px;border:1px solid var(--line);border-radius:12px;z-index:5}a{color:var(--green)}.timer{font-variant-numeric:tabular-nums}.log{border-top:1px solid var(--line);padding:13px 0}.stat{font-size:13px;color:var(--muted);margin-bottom:15px}.onlyprint{display:none}.screenReader{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}@media(max-width:800px){main{padding:25px 18px 80px}.top{height:67px;padding:0 18px}.topnav button{font-size:12px;padding:7px}.brand{font-size:17px}.mark{width:28px;height:28px}.hero{gap:15px;grid-template-columns:1fr}.hero h1{font-size:32px}.note-art{display:none}.grid{grid-template-columns:repeat(2,1fr);gap:13px}.cardbody{padding:15px}.cover{height:150px}.detailhero{grid-template-columns:1fr;gap:20px}.detailhero .cover{height:240px}.detailgrid{grid-template-columns:1fr;gap:12px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.toolbar{flex-wrap:wrap}.toolbar .search{flex-basis:100%}.panel{padding:20px}.detailhero h1{font-size:28px}.stepbody{padding-left:22px}.addcard{min-height:290px}.meta{gap:8px;flex-wrap:wrap}}@media(max-width:450px){.grid{grid-template-columns:1fr}.card{display:grid;grid-template-columns:120px 1fr}.cover{height:100%;min-height:165px}.cardbody h3{font-size:16px}.addcard{min-height:120px}.cardbody .meta{margin-top:10px}.hero h1{font-size:30px}.topnav button{padding:6px}.topnav{gap:0}.ingredientEdit{grid-template-columns:1.2fr .6fr .65fr auto}.ingredientEdit input{font-size:13px}.detailhero .cover{height:220px}}@media print{.top,.noprint,button,.stickyactions,.footer{display:none!important}body{background:white;color:black}main{padding:0}.detailgrid{display:block}.panel,.step{break-inside:avoid}details>*{display:block!important}.detailhero .cover{height:180px}.onlyprint{display:block}.stepbody{padding-left:20px}.detailhero{grid-template-columns:1fr 1fr}}
</style></head><body><header class="top"><button class="brand" onclick="safeHome()"><span class="mark">食</span>ごはんの手帖</button><nav class="topnav" aria-label="メイン"><button id="navhome" onclick="safeHome()">レシピ</button><button onclick="findRecipes()">探す ↗</button><button onclick="backupDialog()">保存・取込</button></nav></header><main id="app"></main><dialog id="modal"></dialog><div id="toast" role="status"></div><script id="shared-data" type="application/json">null</script><script id="curated-data" type="application/json">[]</script><script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),n=>n.toString(16).padStart(2,'0')).join(''),clone=o=>JSON.parse(JSON.stringify(o));
let shared=null;try{shared=JSON.parse($('#shared-data').textContent)}catch{}const KEY=shared?'gohan-shared-'+shared.id:'gohan-note-v1';let recipes=[];try{recipes=JSON.parse(localStorage.getItem(KEY))||(shared?[shared]:[])}catch{recipes=(shared?[shared]:[])}
let audience='general';let current=null,variantId=null,filter='すべて',query='',draft=null,timers=new Map();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(recipes));return true}catch{toast('保存できません。写真を減らすか、先にバックアップしてください。');return false}}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',4000)}
function modal(html){$('#modal').innerHTML=html;$('#modal').showModal()}
function closeModal(){$('#modal').close()}
function titleBar(title){return `<div class="modalhead"><h2>${title}</h2><button onclick="closeModal()" aria-label="閉じる">✕</button></div>`}
function total(v){return Number(v.active||0)+Number(v.wait||0)}
function safeURL(s){try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function image(src,alt){return /^(data:image\/(jpeg|png|webp);base64,|https?:\/\/)/.test(src||'')?`<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`:`<div class="placeholder"><span class="bowl">◡</span><small>写真を登録できます</small></div>`}
function home(){draft=null;current=null;$('#navhome').classList.add('active');$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">MY KITCHEN NOTEBOOK</div><h1>「また作りたい」を、<br>迷わず作れる一皿に。</h1><p>材料も、小さなコツも、自分の分量も。<br>ひとつの手帖に、少しずつ残そう。</p><button class="primary" onclick="editRecipe()">＋ レシピを追加</button></div><div class="note-art" aria-hidden="true"><div class="tile">01　準備する<br><span>↓</span><br>02　調理する</div><div class="tile">ひらけば、<br>手順とコツまで。<br><span>ごはんの手帖</span></div></div></section>${shared?'<div class="soft">受け取ったレシピのコピーです。編集内容はこのブラウザに保存されます。</div>':''}<div class="toolbar"><h2 style="margin:0">レシピの棚 <small id="count" style="font-size:13px"></small></h2><div class="search"><input id="search" placeholder="料理名・材料・タグで探す" aria-label="レシピを検索" value="${esc(query)}" oninput="query=this.value;cards()"></div><button onclick="findRecipes()">新しいレシピを探す ↗</button></div><div class="chips" id="chips"></div><div class="grid" id="cards"></div><div class="footer">このブラウザに自動保存。別の端末へ移すときは「保存・取込」からバックアップ。<br>端末内保存・ログイン不要．元サイトの「保存・取込」からJSONを書き出し，ここへ読み込めます．</div>`;cards();window.scrollTo(0,0)}
function cards(){const cats=['すべて','お気に入り',...new Set(recipes.map(r=>r.category).filter(Boolean))];$('#chips').innerHTML=cats.map(c=>`<button class="chip ${filter===c?'active':''}" onclick="filter=${esc(JSON.stringify(c))};cards()">${esc(c)}</button>`).join('');let list=recipes.filter(r=>(filter==='すべて'||(filter==='お気に入り'?r.favorite:r.category===filter))&&[r.title,r.tags,...r.variants.flatMap(v=>v.ingredients.map(i=>i.name))].join(' ').toLowerCase().includes(query.toLowerCase()));$('#count').textContent=`${list.length}件`;$('#cards').innerHTML=list.map(r=>`<article class="card" tabindex="0" role="button" aria-label="${esc(r.title)}を開く" onclick="openRecipe('${r.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openRecipe('${r.id}')}"><div class="cover">${image(r.photo,r.title)}<span class="badge">${esc(r.category||'未分類')}</span></div><div class="cardbody"><span class="tag">${r.variants.length}つの分量</span><h3>${esc(r.title)}</h3><small>${esc((r.desc||'').slice(0,48))}</small><div class="meta"><span>◷ 約${total(r.variants[0])}分</span><span>${esc(r.variants[0].amount)}${esc(r.variants[0].unit)}</span>${r.favorite?'<span>♥</span>':''}</div></div></article>`).join('')+`<button class="addcard" onclick="editRecipe()"><span class="plus">＋</span><strong>新しいレシピ</strong><span class="help">自分の定番を、ここに。</span></button>`}
function openRecipe(id,vid){draft=null;const r=recipes.find(r=>r.id===id);if(!r)return;current=id;let v=r.variants.find(v=>v.id===(vid||variantId));if(v)audience=v.scope==='home'?'home':'general';else v=r.variants.find(v=>(v.scope==='home'?'home':'general')===audience)||r.variants[0];audience=v.scope==='home'?'home':'general';variantId=v.id;$('#app').innerHTML=`<button class="back" onclick="home()">← レシピの棚に戻る</button><section class="detailhero"><div class="cover">${image(r.photo,r.title)}</div><div><div class="eyebrow">${esc(r.category||'MY RECIPE')} / RECIPE NOTE</div><h1>${esc(r.title)}</h1><p class="muted">${esc(r.desc)}</p><div class="row"><span class="tag">作業 ${v.active||0}分</span><span class="tag">待ち ${v.wait||0}分</span><span class="tag">合計 約${total(v)}分</span></div><div class="row" style="margin-top:20px"><button class="small" onclick="toggleFav()">${r.favorite?'♥ お気に入り':'♡ お気に入り'}</button><button class="small" onclick="editRecipe(current)">編集</button><button class="small" onclick="shareDialog()">↗ このレシピを渡す</button></div>${r.photoNote?`<small>${esc(r.photoNote)}</small>`:''}</div></section><div class="detailgrid"><aside><section class="panel"><div class="eyebrow">AMOUNT</div><h2>今日作るレシピ</h2><div class="row noprint"><button class="small ${audience==='general'?'primary':''}" onclick="switchAudience('general')">一般用</button><button class="small ${audience==='home'?'primary':''}" onclick="switchAudience('home')">🔒 わが家用</button></div><p class="help">${audience==='home'?'わが家の機材名・設定で作る、自分専用の版。共有データには入りません。':'誰にでも伝わる道具名・説明で書く、共有できる版。'}</p><div class="variants">${r.variants.filter(x=>(x.scope==='home'?'home':'general')===audience).map(x=>`<button class="small variant ${x.id===v.id?'active':''}" onclick="openRecipe(current,'${x.id}')">${esc(x.name)}</button>`).join('')}</div><button class="small" onclick="branchDialog()">＋ 分量を変えて分岐</button>${audience==='general'?'<button class="small" style="margin-top:8px" onclick="makeHomeVersion()">🔒 この版からわが家用を作る</button>':''}<p class="help" style="margin-top:12px">${esc(v.amount)}${esc(v.unit)} ／ ${v.verified?'✓ この分量で調理済み':'調理前・未検証'}</p>${v.parentName?`<p class="help">分岐元：${esc(v.parentName)}</p>`:''}${v.branchNote?`<div class="warning">${esc(v.branchNote)}</div>`:''}<h3 class="sectiontitle">材料</h3><p class="help">チェックして準備できます．※は分量変更時に手動で調整する材料です．</p><ul class="ingredients">${v.ingredients.map(i=>`<li><label class="check"><input type="checkbox"><span>${esc(i.name)}${i.mode==='manual'?'<small> ※</small>':''}</span></label><span>${esc(i.qty)} ${esc(i.unit)}</span></li>`).join('')}</ul><button class="small" onclick="copyShopping()">買い物リストをコピー</button></section><details class="panel"><summary>必要な道具・機材</summary><p style="white-space:pre-wrap;margin-top:15px">${esc(v.equipment||'未記入')}</p></details></aside><section><div class="row between"><div><div class="eyebrow">COOKING FLOW</div><h2>作り方の流れ</h2></div><button class="small noprint" onclick="expandAll()">すべて開く</button></div><p class="muted">流れをタップすると、詳しい手順とコツが開きます。</p>${v.prep?`<details class="step"><summary><span class="num">0</span><strong>作り始める前に</strong></summary><div class="stepbody">${esc(v.prep)}</div></details>`:''}${v.steps.map((s,i)=>`<details class="step"><summary><span class="num">${i+1}</span><strong>${esc(s.title)}</strong>${s.minutes>0?`<small>${s.minutes}分</small>`:''}</summary><div class="stepbody">${s.photo?image(s.photo,s.title):''}${esc(s.detail)}${s.tip?`<div class="tip">コツ・注意<br>${esc(s.tip)}</div>`:''}${s.minutes>0?`<div class="row noprint"><button class="small" onclick="startTimer('${v.id}-${i}',${Number(s.minutes)})">◷ ${s.minutes}分タイマー</button><span class="timer" data-timer="${v.id}-${i}"></span></div>`:''}</div></details>`).join('')}${[['完成の見分け方',v.done],['失敗しやすい点・対処',v.pitfalls],['代用・アレンジ',v.substitutions],['保存・温め直し',v.storage],['この分量のメモ',v.notes]].filter(x=>x[1]).map(([t,b])=>`<details class="step"><summary><strong>${t}</strong></summary><div class="stepbody" style="padding-left:22px">${esc(b)}</div></details>`).join('')}<section class="panel"><div class="row between"><h3 style="margin:0">作った記録</h3><button class="small" onclick="logDialog()">＋ 記録する</button></div>${r.logs.length?r.logs.slice().reverse().map(l=>`<div class="log"><small>${esc(l.date)} · ${esc(l.variant)}</small><div style="white-space:pre-wrap">${esc(l.note)}</div></div>`).join(''):'<p class="help" style="margin-top:15px">味の濃さ、実際にかかった時間、次回変えたいことを残せます。</p>'}</section><section class="panel"><h3>出典</h3>${safeURL(r.source)?`<a href="${esc(safeURL(r.source))}" target="_blank" rel="noopener noreferrer">${esc(r.sourceName||'元のレシピを見る')} ↗</a>`:`<p>${esc(r.sourceName||'未登録')}</p>`}<p class="help">元の投稿や参考URLを残して、出典をたどれるように。</p>${r.id.startsWith('notion-')?'<a href="https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/shokuhin/syokuchu/campylobacterqa.html" target="_blank" rel="noopener noreferrer">加熱確認の補足出典（厚生労働省） ↗</a>':''}</section></section></div>`;window.scrollTo(0,0);tick()}
function getR(){return recipes.find(r=>r.id===current)}function getV(){return getR().variants.find(v=>v.id===variantId)}
function toggleFav(){const r=getR();r.favorite=!r.favorite;persist();openRecipe(current)}
function expandAll(){document.querySelectorAll('details.step').forEach(x=>x.open=true)}
function startTimer(k,m){if(timers.has(k)){if(confirm('このタイマーを取り消しますか？'))timers.delete(k);return}timers.set(k,{end:Date.now()+m*60000});tick()}
function tick(){timers.forEach((t,k)=>{const n=Math.max(0,Math.ceil((t.end-Date.now())/1000));document.querySelectorAll('[data-timer]').forEach(e=>{if(e.dataset.timer===k)e.textContent=n?`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`:'時間です'});if(!n&&!t.fired){t.fired=true;toast('タイマーの時間になりました');if(navigator.vibrate)navigator.vibrate(250)}})}setInterval(tick,1000);
function field(id,label,value='',type='text',hint=''){return `<div class="field"><label for="${id}">${label}</label>${type==='textarea'?`<textarea id="${id}">${esc(value)}</textarea>`:`<input id="${id}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="any"':''}>`}${hint?`<span class="help">${hint}</span>`:''}</div>`}
function editRecipe(id){draft=id?clone(recipes.find(r=>r.id===id)):{id:uid(),title:'',desc:'',category:'',tags:'',photo:'',source:'',sourceName:'',variants:[{id:uid(),scope:'home',name:'基本の分量',amount:2,unit:'人分',active:0,wait:0,equipment:'',ingredients:[],steps:[],prep:'',done:'',pitfalls:'',substitutions:'',storage:'',notes:'',verified:false}],logs:[]};if(id)current=id;const v=draft.variants.find(v=>v.id===variantId)||draft.variants[0];variantId=v.id;renderEditor()}
function dv(){return draft.variants.find(v=>v.id===variantId)}
function renderEditor(){const r=draft,v=dv();$('#app').innerHTML=`<div class="editor"><button class="back" onclick="cancelEdit()">← 編集をやめて戻る</button><div class="eyebrow">RECIPE EDITOR</div><h1 style="font-size:30px">${recipes.some(x=>x.id===r.id)?'レシピを整える':'新しいレシピを残す'}</h1><p class="muted">まずは料理名と手順から。詳しい情報は後から足せます。</p><section class="panel"><h2>共通の基本情報</h2><p class="help">料理名・概要・写真・出典は一般用にも使われます。家の機材名や自分専用の情報は、下の「わが家用」の手順・道具欄に書いてください。</p><div class="formgrid">${field('etitle','料理名 *',r.title)}${field('ecategory','分類',r.category,'text','ごはん、おかず、スープなど')}<div class="wide">${field('edesc','どんな料理？',r.desc,'textarea')}</div>${field('etags','タグ（カンマ区切り）',r.tags)}${field('esource','参考URL・元の投稿',r.source,'url')}${field('esourcename','出典・投稿者名',r.sourceName)}${field('ephotonote','写真の説明・出典',r.photoNote)}<div class="wide"><label>完成写真</label><div style="height:150px;width:200px;margin:10px 0">${image(r.photo,r.title)}</div><input type="file" accept="image/*" aria-label="完成写真を選ぶ" onchange="uploadPhoto(this,'cover')"><button class="small" onclick="capture();draft.photo='';renderEditor()">写真を外す</button><p class="help">自分の写真、または利用許可のある写真を選んでください。</p></div></div></section><section class="panel"><div class="eyebrow">${esc(v.name)}</div><h2>${v.scope==='home'?'🔒 わが家用':'一般用'}のレシピ</h2>${recipes.some(x=>x.id===r.id)?`<p class="help">${v.scope==='home'?'わが家用は共有対象外です。一般用には自動で反映しません。':'この版は人に渡すデータに含まれます。'}</p>`:`<div class="field"><label for="escope">この版の用途</label><select id="escope"><option value="home" ${v.scope==='home'?'selected':''}>🔒 わが家用（共有しない）</option><option value="general" ${v.scope!=='home'?'selected':''}>一般用（共有できる）</option></select></div>`}<p class="help">別の分量は、保存後に「分量を変えて分岐」から追加できます。</p><div class="formgrid">${field('evname','分量の名前',v.name)}<div class="row">${field('eamount','基準量 *',v.amount,'number')}${field('eunit','単位',v.unit)}</div>${field('eactive','作業時間（分）',v.active,'number')}${field('ewait','待ち時間（分）',v.wait,'number')}</div><label class="check"><input id="everified" type="checkbox" ${v.verified?'checked':''}>この分量で実際に作って確認した</label><h3 class="sectiontitle">材料</h3><p class="help">「倍率で計算」は分量変更時に自動計算。「手動で調整」は水加減・塩少々など。</p><div id="ingrows">${v.ingredients.map((i,k)=>`<div class="ingredientEdit"><input aria-label="材料名" placeholder="材料名" data-i="${k}" data-f="name" value="${esc(i.name)}"><input aria-label="量" placeholder="量" data-i="${k}" data-f="qty" value="${esc(i.qty)}"><input aria-label="単位" placeholder="g・大さじ" data-i="${k}" data-f="unit" value="${esc(i.unit)}"><button class="small" aria-label="材料を削除" onclick="capture();dv().ingredients.splice(${k},1);renderEditor()">✕</button><select class="mode" aria-label="分量変更時の計算方法" data-i="${k}" data-f="mode"><option value="scale" ${i.mode==='scale'?'selected':''}>分量の倍率で計算</option><option value="manual" ${i.mode==='manual'?'selected':''}>手動で調整（自動計算しない）</option></select></div>`).join('')}</div><button class="small" onclick="capture();dv().ingredients.push({name:'',qty:'',unit:'',mode:'scale'});renderEditor()">＋ 材料</button>${field('eequipment',v.scope==='home'?'わが家の機材名・型番・設定':'必要な道具・機材（サイズ・容量も）',v.equipment,'textarea',v.scope==='home'?'例：うちの象印○○／炊き込みモード、いつもの24cm鍋。機材の型番・容量を具体的に。':'例：直径24cmフライパン、ふた、電子レンジ600W')}${field('eprep','下準備・始める前に',v.prep,'textarea')}<h3 class="sectiontitle">大まかな流れ → 詳しい手順</h3><p class="help">見出しは短く。詳細には、分量・火加減・時間・見た目の目安を具体的に。</p><div id="steprows">${v.steps.map((s,k)=>`<div class="stepedit"><div class="row between"><span class="tag">STEP ${k+1}</span><div class="row"><button class="small" onclick="moveStep(${k},-1)" ${k===0?'disabled':''} aria-label="手順を上へ">↑</button><button class="small" onclick="moveStep(${k},1)" ${k===v.steps.length-1?'disabled':''} aria-label="手順を下へ">↓</button><button class="small danger" onclick="capture();dv().steps.splice(${k},1);renderEditor()">削除</button></div></div>${field('st'+k,'流れの見出し',s.title)}${field('sd'+k,'詳しい作り方',s.detail,'textarea')}${field('sm'+k,'この工程の時間（分・任意）',s.minutes,'number')}${field('sp'+k,'コツ・注意・失敗したとき',s.tip,'textarea')}${s.photo?`<div style="height:100px;width:140px">${image(s.photo,s.title)}</div><button class="small" onclick="capture();dv().steps[${k}].photo='';renderEditor()">写真を外す</button>`:''}<div class="field"><label>工程の写真</label><input type="file" accept="image/*" onchange="uploadPhoto(this,${k})"></div></div>`).join('')}</div><button onclick="capture();dv().steps.push({title:'',detail:'',minutes:0,tip:'',photo:''});renderEditor()">＋ 工程を追加</button></section><details class="panel"><summary>もっと詳しく：完成の目安・保存・代用</summary>${field('edone','完成の見分け方',v.done,'textarea')}${field('epitfalls','失敗しやすい点・対処',v.pitfalls,'textarea')}${field('esubstitutions','代用・アレンジ',v.substitutions,'textarea')}${field('estorage','保存方法・期限・温め直し',v.storage,'textarea')}${field('enotes','この分量のメモ',v.notes,'textarea')}</details><div class="stickyactions">${recipes.some(x=>x.id===r.id)?'<button class="danger" onclick="deleteRecipe()">削除</button>':''}<button onclick="cancelEdit()">キャンセル</button><button class="primary" onclick="saveRecipe()">保存する</button></div></div>`}
function capture(){const v=dv();if($('#escope'))v.scope=$('#escope').value;for(const [f,id]of Object.entries({title:'etitle',category:'ecategory',desc:'edesc',tags:'etags',source:'esource',sourceName:'esourcename',photoNote:'ephotonote'}))draft[f]=$('#'+id).value;for(const [f,id]of Object.entries({name:'evname',amount:'eamount',unit:'eunit',active:'eactive',wait:'ewait',equipment:'eequipment',prep:'eprep',done:'edone',pitfalls:'epitfalls',substitutions:'esubstitutions',storage:'estorage',notes:'enotes'}))v[f]=$('#'+id).value;v.verified=$('#everified').checked;$('#ingrows').querySelectorAll('[data-i]').forEach(e=>v.ingredients[Number(e.dataset.i)][e.dataset.f]=e.value);v.steps.forEach((s,k)=>{s.title=$('#st'+k).value;s.detail=$('#sd'+k).value;s.minutes=Number($('#sm'+k).value);s.tip=$('#sp'+k).value})}
function saveRecipe(){capture();const v=dv();if(!draft.title.trim()){toast('料理名を入力してください');$('#etitle').focus();return}if(!(Number(v.amount)>0)||!v.unit.trim()){toast('0より大きい基準量と単位を入力してください');return}if(!v.steps.length||v.steps.some(s=>!s.title.trim()||!s.detail.trim())){toast('少なくとも1つ、見出しと詳しい作り方を入力してください');return}if([v.active,v.wait,...v.steps.map(s=>s.minutes)].some(n=>!Number.isFinite(Number(n))||Number(n)<0)){toast('時間は0以上の数値で入力してください');return}v.amount=Number(v.amount);v.active=Number(v.active);v.wait=Number(v.wait);v.ingredients=v.ingredients.filter(i=>i.name.trim());draft.updated=new Date().toISOString();const before=recipes;recipes=recipes.filter(r=>r.id!==draft.id).concat(clone(draft));if(!persist()){recipes=before;return}openRecipe(draft.id,variantId);toast('レシピを保存しました')}
function cancelEdit(){if(confirm('保存していない変更を破棄して戻りますか？')){if(current&&recipes.some(r=>r.id===current))openRecipe(current);else home()}}
function deleteRecipe(){if(!confirm('このレシピと分岐・記録を削除しますか？'))return;const prev=recipes;recipes=recipes.filter(r=>r.id!==draft.id);if(!persist()){recipes=prev;return}filter='すべて';home()}
function moveStep(k,d){capture();const a=dv().steps;[a[k],a[k+d]]=[a[k+d],a[k]];renderEditor()}
async function uploadPhoto(input,k){const f=input.files[0];if(!f)return;capture();try{if(!f.type.startsWith('image/'))throw Error('画像を選んでください');const bmp=await createImageBitmap(f),c=document.createElement('canvas');const scale=Math.min(1,1200/Math.max(bmp.width,bmp.height));c.width=Math.round(bmp.width*scale);c.height=Math.round(bmp.height*scale);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.78);bmp.close();if(k==='cover')draft.photo=data;else dv().steps[k].photo=data;renderEditor();toast('写真を追加しました。最後に保存してください。')}catch{toast('画像を読み込めませんでした。JPEG・PNGなどでお試しください。')}}
function branchDialog(){const v=getV();modal(titleBar('分量を変えて、別の版に')+`<p class="muted">「${esc(v.name)}」を残したまま、材料を計算してコピーします。</p>${field('bamount','新しい基準量',v.amount,'number')}<p class="help">単位：${esc(v.unit)} ／ 元は${esc(v.amount)}${esc(v.unit)}</p>${field('bname','分岐の名前（空欄なら自動）')}<div class="warning">水・加熱時間・道具の容量は単純な倍率では決まりません。工程内の分量表記もそのままコピーするため、分岐後に確認・編集してください。</div><div class="row" style="margin-top:20px"><button class="primary" onclick="makeBranch()">分岐して確認・編集</button></div>`)}
function makeBranch(){const a=Number($('#bamount').value),v=getV();if(!Number.isFinite(a)||a<=0)return toast('0より大きい分量を入力してください');const n=clone(v),ratio=a/Number(v.amount);n.id=uid();n.name=$('#bname').value.trim()||a+v.unit+'版';n.amount=a;n.parentName=v.name;n.parentId=v.id;n.verified=false;n.branchNote=`${v.amount}${v.unit}から${a}${v.unit}へ（${Math.round(ratio*1000)/1000}倍）。材料の数値のみ仮計算。水加減・工程内の分量・加熱時間・機材の容量を確認してください。`;n.ingredients=n.ingredients.map(i=>{if(i.mode==='scale'&&String(i.qty).trim()!==''&&Number.isFinite(Number(i.qty)))return {...i,qty:Math.round(Number(i.qty)*ratio*100)/100};return {...i,mode:'manual'}});draft=clone(getR());draft.variants.push(n);variantId=n.id;closeModal();renderEditor();toast('分岐を作成しました。内容を確認して保存してください。')}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('コピーしました')}catch{modal(titleBar('コピーする内容')+`<textarea style="width:100%;height:250px" readonly>${esc(t)}</textarea><p class="help">長押しして全選択・コピーしてください。</p>`)}}
function copyShopping(){const v=getV();copyText(getR().title+' / '+(v.scope==='home'?'わが家用':'一般用')+' / '+v.name+'\n'+v.ingredients.map(i=>`□ ${i.name}：${i.qty} ${i.unit}`).join('\n'))}
function logDialog(){modal(titleBar('作った記録')+field('ldate','日付',new Date().toLocaleDateString('sv-SE'),'date')+field('lnote','味・実際の時間・次回変えたいこと','','textarea')+'<button class="primary" onclick="saveLog()">記録を保存</button>')}
function saveLog(){if(!$('#lnote').value.trim())return toast('記録を入力してください');const r=getR(),v=getV();r.logs.push({date:$('#ldate').value,variant:v.name,variantId:v.id,note:$('#lnote').value});if(!persist()){r.logs.pop();return}closeModal();openRecipe(current)}
function findRecipes(){modal(titleBar('新しいレシピを探す')+`<p class="muted">食材や料理名から、元のレシピを探せます。</p>${field('findq','何を作りたい？','','text','例：塩角煮、炊き込みご飯 2合')}<div class="row"><button class="primary" onclick="searchWeb('web')">Webで検索 ↗</button><button onclick="searchWeb('x')">Xで検索 ↗</button></div><div class="soft" style="margin-top:20px"><strong>見つけたら、手帖に残す</strong><p class="help">元のURLを保存し、材料や手順を入力できます。自動取得・自動巡回は行いません。</p><button class="small" onclick="closeModal();editRecipe()">＋ レシピを登録</button><button class="small" onclick="makePrompt()">ChatGPTへの整理依頼をコピー</button></div>`)}
function searchWeb(where){const q=$('#findq').value.trim();if(!q)return toast('料理名や食材を入力してください');window.open(where==='x'?'https://x.com/search?q='+encodeURIComponent(q+' レシピ'):'https://www.google.com/search?q='+encodeURIComponent(q+' レシピ'),'_blank','noopener,noreferrer')}
function makePrompt(){const q=$('#findq').value.trim()||'このレシピ';copyText(`「${q}」を、ごはんの手帖に登録できるよう調べて整理して。元の投稿URL・出典・写真の利用可否を確認し、料理名、概要、基準の量と単位、作業時間と待ち時間、材料名/量/単位、必要機材と容量、下準備、各工程の短い見出し/具体的な手順/分量/火加減/時間/コツ、完成の目安、失敗対策、代用、保存方法を出して。不明な点は未確認と明記し、分量を変えるとき自動計算してよい材料と、水加減・加熱時間など個別確認が必要な項目を分けて。`) }
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function filename(t){return t.replace(/[\\/:*?"<>|]/g,'_').slice(0,80)}
function publicRecipe(r=getR()){
 const variants=r.variants.filter(v=>v.scope!=='home').map(v=>{const n={id:v.id,scope:'general',name:v.name,amount:v.amount,unit:v.unit,active:v.active,wait:v.wait,verified:v.verified};for(const f of ['equipment','ingredients','prep','steps','done','pitfalls','substitutions','storage','notes'])n[f]=clone(v[f]??(f==='ingredients'||f==='steps'?[]:''));return n});
 if(!variants.length)return null;
 return {id:r.id,title:r.title,desc:r.desc,category:r.category,tags:r.tags,photo:r.photo,photoNote:r.photoNote,source:r.source,sourceName:r.sourceName,variants,logs:[],favorite:false};
}
function shareDialog(){const r=publicRecipe();if(!r){modal(titleBar('一般用がまだありません')+'<p>この料理はわが家用だけです。わが家用の情報は共有できません。</p><button class="primary" onclick="closeModal();newGeneralVersion()">空の一般用を追加する</button>');return}modal(titleBar('一般用だけを渡す')+`<p class="muted">「${esc(r.title)}」の一般用 ${r.variants.length}件を渡します。</p><div class="soft">🔒 わが家用の分量・機材・手順・メモと、作った記録は一切含みません。</div><p class="help">共通の料理名・概要・写真・出典は含まれます。</p><section class="panel"><h3>読む人向け：レシピHTML</h3><p class="help">写真・一般用の全分量・手順を1ファイルに。開くと詳細をタップして読めます。端末によってHTML表示に制限があります。</p><button class="primary" onclick="exportHTML()">一般用のHTMLを保存・共有</button></section><div class="row"><button onclick="exportOne()">一般用JSONを保存</button><button onclick="printRecipe()">一般用を印刷・PDFにする</button></div><p class="help" style="margin-top:15px">この料理だけが対象です。公開リンクは作成されません。</p>`)}
function exportOne(){const r=publicRecipe();if(!r)return toast('共有できる一般用がありません');download(new Blob([JSON.stringify({format:'gohan-note',version:1,recipes:[r]},null,2)],{type:'application/json'}),filename(r.title)+'_一般用.json');toast('一般用だけのJSONを保存しました')}
async function exportHTML(){const r=publicRecipe();if(!r)return toast('共有できる一般用がありません');try{const doc=document.documentElement.cloneNode(true);if(doc.querySelector('#curated-data'))doc.querySelector('#curated-data').textContent='[]';doc.querySelector('#shared-data').textContent=JSON.stringify(r).replace(/</g,'\\u003c');doc.querySelector('#app').innerHTML='';doc.querySelector('#modal').innerHTML='';doc.querySelector('#modal').removeAttribute('open');doc.querySelector('#toast').textContent='';doc.querySelector('#toast').style.display='none';doc.querySelector('title').textContent=r.title+'｜ごはんの手帖';const file=new File(['<!doctype html>'+doc.outerHTML],filename(r.title)+'_一般用.html',{type:'text/html'});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:r.title});return}catch(e){if(e.name==='AbortError')return}}download(file,file.name);toast('一般用だけのレシピHTMLを保存しました')}catch{toast('HTMLの保存に失敗しました。JSON保存をお試しください。')}}
function printRecipe(){const r=publicRecipe();if(!r)return;const frame=document.createElement('iframe');frame.style.cssText='position:fixed;width:0;height:0;border:0';frame.srcdoc=`<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>${esc(r.title)}</title><style>body{font:14px/1.8 sans-serif;margin:30px}img{max-width:300px;max-height:200px;object-fit:cover}h1{font-size:24px}h2{margin-top:30px}section{break-before:page}p{white-space:pre-wrap}li{margin:10px 0}</style><\/head><body><h1>${esc(r.title)}</h1><p>${esc(r.desc)}</p>${r.photo?image(r.photo,r.title):''}<p>${esc(r.photoNote||'')}</p>${r.variants.map(v=>`<section><h2>一般用 / ${esc(v.name)} (${esc(v.amount)}${esc(v.unit)})</h2><p>作業 ${v.active}分 ＋ 待ち ${v.wait}分</p><h3>材料</h3><ul>${v.ingredients.map(i=>`<li>${esc(i.name)}：${esc(i.qty)} ${esc(i.unit)}</li>`).join('')}</ul><h3>道具</h3><p>${esc(v.equipment)}</p><h3>下準備</h3><p>${esc(v.prep)}</p><ol>${v.steps.map(s=>`<li><strong>${esc(s.title)}</strong><p>${esc(s.detail)}</p>${s.photo?image(s.photo,s.title):''}<p>${esc(s.tip)}</p></li>`).join('')}</ol>${[['完成の目安',v.done],['失敗対策',v.pitfalls],['代用',v.substitutions],['保存',v.storage],['メモ',v.notes]].filter(x=>x[1]).map(([a,b])=>`<h3>${a}</h3><p>${esc(b)}</p>`).join('')}</section>`).join('')}<h3>出典</h3><p>${esc(r.sourceName)} ${esc(r.source)}</p><\/body><\/html>`;frame.onload=()=>{frame.contentWindow.focus();frame.contentWindow.print();setTimeout(()=>frame.remove(),60000)};document.body.append(frame)}
function switchAudience(scope){const v=getR().variants.find(v=>(v.scope==='home'?'home':'general')===scope);if(v)openRecipe(current,v.id);else if(scope==='home')makeHomeVersion();else modal(titleBar('一般用を追加')+'<p>わが家用の内容をコピーせず、空の一般用を作成します。</p><button class="primary" onclick="closeModal();newGeneralVersion()">一般用を作る</button>')}
function makeHomeVersion(){draft=clone(getR());const v=clone(getV());v.id=uid();v.scope='home';v.name=getV().name+'（わが家）';v.parentName='一般用：'+getV().name;v.verified=false;draft.variants.push(v);variantId=v.id;renderEditor();toast('わが家用のコピーです。家の機材名に変えて保存できます。')}
function newGeneralVersion(){draft=clone(getR());const v={id:uid(),scope:'general',name:'基本の分量',amount:2,unit:'人分',active:0,wait:0,equipment:'',ingredients:[],steps:[],verified:false};draft.variants.push(v);variantId=v.id;renderEditor()}
function backupDialog(){modal(titleBar('保存・取込')+`<p class="muted">レシピと写真は、この端末・ブラウザに保存されます。ブラウザのデータ削除に備えて、定期的にバックアップしてください。</p><section class="panel"><h3>自分用の完全バックアップ</h3><div class="warning">わが家用・機材名・調理記録も含みます。他の人に渡すときは各レシピの「このレシピを渡す」を使ってください。</div><p class="help">${recipes.length}件のレシピ・分量違い・写真・記録をJSONにまとめます。</p><button onclick="exportAll()">バックアップを保存</button></section><section class="panel"><h3>受け取ったレシピ・バックアップを取り込む</h3><input type="file" accept=".json,application/json" aria-label="取込用JSON" onchange="importFile(this)"><p class="help">今のレシピは残ります。同じIDのレシピは別のコピーとして追加します。写真込みのファイルは20MBまで。</p></section>`)}
function exportAll(){download(new Blob([JSON.stringify({format:'gohan-note',version:1,recipes},null,2)],{type:'application/json'}),'ごはんの手帖_backup_'+new Date().toLocaleDateString('sv-SE')+'.json');toast('バックアップを保存しました')}
function normalizeRecipe(r){if(!r||typeof r.title!=='string'||!Array.isArray(r.variants)||!r.variants.length)throw Error();const n={id:uid(),title:r.title,desc:String(r.desc||''),category:String(r.category||''),tags:String(r.tags||''),photo:typeof r.photo==='string'?r.photo:'',photoNote:String(r.photoNote||''),source:String(r.source||''),sourceName:String(r.sourceName||''),favorite:!!r.favorite,logs:[],variants:[],updated:new Date().toISOString()};n.logs=(Array.isArray(r.logs)?r.logs:[]).map(l=>({date:String(l.date||''),variant:String(l.variant||''),note:String(l.note||'')}));n.variants=r.variants.map(v=>{if(!(Number(v.amount)>0)||!Array.isArray(v.ingredients)||!Array.isArray(v.steps))throw Error();const z={id:uid(),amount:Number(v.amount),unit:String(v.unit||'人分'),name:String(v.name||'基本'),scope:v.scope==='home'?'home':'general',active:Math.max(0,Number(v.active)||0),wait:Math.max(0,Number(v.wait)||0),verified:!!v.verified};for(const f of ['equipment','prep','done','pitfalls','substitutions','storage','notes','parentName','branchNote'])z[f]=String(v[f]||'');z.ingredients=v.ingredients.map(i=>({name:String(i.name||''),qty:String(i.qty??''),unit:String(i.unit||''),mode:i.mode==='manual'?'manual':'scale'}));z.steps=v.steps.map(s=>({title:String(s.title||''),detail:String(s.detail||''),tip:String(s.tip||''),minutes:Math.max(0,Number(s.minutes)||0),photo:typeof s.photo==='string'?s.photo:''}));return z});return n}
async function importFile(input){try{const f=input.files[0];if(!f)return;if(f.size>20*1024*1024)return toast('20MB以内のJSONを選んでください');const data=JSON.parse(await f.text());if(data.format!=='gohan-note'||data.version!==1||!Array.isArray(data.recipes))throw Error();const batch=data.recipes.map(normalizeRecipe);if(!batch.length)throw Error();if(!confirm(batch.length+'件のレシピを追加しますか？'))return;const prev=recipes;recipes=[...recipes,...batch];if(!persist()){recipes=prev;return}closeModal();filter='すべて';query='';home();toast(batch.length+'件を取り込みました')}catch{toast('取込形式が合いません。ごはんの手帖のJSONを選んでください。')}}
function safeHome(){if(draft&&$('#etitle')&&!confirm('保存せずにレシピの棚へ戻りますか？'))return;home()}
// Local-only migration. No server, authentication, telemetry, or AI calls.
function settingsSnapshot(){return {filter,query,audience,variantId}}
function validateBackup(data){
 if(!data||data.format!=='gohan-note'||![1,2].includes(data.version)||!Array.isArray(data.recipes))throw Error('対応するバックアップではありません');
 const ids=new Set;const out=clone(data);
 for(const r of out.recipes){
  if(!r||typeof r.title!=='string'||!Array.isArray(r.variants)||!r.variants.length||!Array.isArray(r.logs||[]))throw Error('レシピの構造が不正です');
  if(typeof r.id!=='string'||!/^[\w-]{1,160}$/.test(r.id)||ids.has(r.id))throw Error('レシピIDが不正・重複しています');ids.add(r.id);
  const vids=new Set;
  for(const v of r.variants){if(!v||typeof v.id!=='string'||!/^[\w-]{1,160}$/.test(v.id)||vids.has(v.id)||!Number.isFinite(Number(v.amount))||Number(v.amount)<=0||!Array.isArray(v.ingredients)||!Array.isArray(v.steps))throw Error('分量データが不正です');vids.add(v.id);if(v.scope&&!['general','home'].includes(v.scope))throw Error('公開区分が不正です');v.scope=v.scope||'general';for(const f of ['active','wait'])if(!Number.isFinite(Number(v[f]||0))||Number(v[f]||0)<0)throw Error('時間が不正です');for(const i of v.ingredients)if(!i||typeof i.name!=='string')throw Error('材料が不正です');for(const st of v.steps)if(!st||typeof st.title!=='string'||typeof st.detail!=='string')throw Error('手順が不正です')}
  for(const v of r.variants)if(v.parentId&&!vids.has(v.parentId))throw Error('分岐元が見つかりません');
  for(const l of r.logs||[])if(l.variantId&&!vids.has(l.variantId))throw Error('記録の分量リンクが不正です');
  r.logs=r.logs||[];r.tags=r.tags||'';r.desc=r.desc||'';
  for(const o of [r,...r.variants.flatMap(v=>v.steps)])if(o.photo&&!( /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=\s]+$/.test(o.photo)||/^https?:\/\//.test(o.photo)))throw Error('写真形式が不正です');
 }
 return out;
}
async function portableBackup(){const data={format:'gohan-note',version:2,exportedAt:new Date().toISOString(),recipes:clone(recipes),settings:settingsSnapshot()};
 for(const r of data.recipes)for(const o of [r,...r.variants.flatMap(v=>v.steps)])if(o.photo&&!o.photo.startsWith('data:')){const original=o.photo;let response;try{response=await fetch(original,{credentials:'omit'});if(!response.ok)throw Error();const blob=await response.blob();if(!/^image\/(jpeg|png|webp|gif)$/.test(blob.type))throw Error();o.photo=await new Promise((resolve,reject)=>{const reader=new FileReader;reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)});o.photoOriginalUrl=original}catch{throw Error('写真の実体を取得できません：'+r.title+'．写真を端末から登録し直してください．URLだけのバックアップは作成しません．')}}
 return validateBackup(data);
}
async function exportAll(){try{const data=await portableBackup();download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'gohan-note-full-'+new Date().toISOString().slice(0,10)+'.json');toast('写真本体を含むバックアップを保存しました')}catch(e){toast(e.message)}}
function backupDialog(){modal(titleBar('バックアップ・移行')+`<p>写真・一般用／わが家用・分量の分岐・記録・出典・並び順をJSONに保存します．保存先はこのブラウザ内です．</p><div class="warning">完全バックアップは自分用です．他人へ渡す場合はレシピの共有を使ってください．</div><p><button class="primary" onclick="exportAll()">現在の全データを保存</button></p><p class="help">先に上のボタンでバックアップを保存してから読み込めます．元サイトで取得した旧形式JSONにも対応します．</p><div class="field"><label for="restore-mode">読み込み方法</label><select id="restore-mode"><option value="replace">完全復元（ID・順番・関連を保持して置換）</option><option value="append">コピーとして追加（既存データを残す）</option></select></div><input type="file" accept=".json,application/json" aria-label="移行JSONを選ぶ" onchange="importFile(this)"><p class="help">元サイト→保存・取込→バックアップ保存→このページで読み込み．URLが変わると端末内データは自動移動しません．写真の外部URLは取得可能な場合だけ実体化できます．外部の出典・検索リンクはリンク先の継続に依存します．このアプリには保存済みPDFの管理機能はありません．</p>`)}
function copyForAppend(rows){return rows.map(r=>{r=clone(r);r.id=uid();const map=new Map(r.variants.map(v=>[v.id,uid()]));r.variants.forEach(v=>{v.id=map.get(v.id);if(v.parentId)v.parentId=map.get(v.parentId)});r.logs.forEach(l=>{if(l.variantId)l.variantId=map.get(l.variantId)});return r})}
async function importFile(input){try{const f=input.files[0];if(!f)return;if(f.size>50*1024*1024)throw Error('50MB以内のJSONを選んでください');const data=validateBackup(JSON.parse(await f.text()));const replace=$('#restore-mode')?.value!=='append';if(!confirm(`${data.recipes.length}件を${replace?'完全復元':'追加'}します．${replace?'現在のデータは置換されます．先にバックアップを保存してください．':''}続けますか？`))return;
 const next=replace?data.recipes:[...recipes,...copyForAppend(data.recipes)];
 // One atomic storage write; quota/errors leave the previous data intact.
 localStorage.setItem(KEY,JSON.stringify(next));recipes=next;
 const st=replace?data.settings:null;if(st){filter=typeof st.filter==='string'?st.filter:'すべて';query=typeof st.query==='string'?st.query:'';audience=st.audience==='home'?'home':'general';variantId=typeof st.variantId==='string'?st.variantId:null}try{localStorage.setItem(KEY+'-settings',JSON.stringify(settingsSnapshot()))}catch{}
 closeModal();home();toast('復元しました．再読み込みしても残ります．');
 }catch(e){toast('読み込みを中止しました．既存データは保持されています．'+e.message)}finally{input.value=''}}
try{const st=JSON.parse(localStorage.getItem(KEY+'-settings')||'null');if(st){filter=st.filter||'すべて';query=st.query||'';audience=st.audience==='home'?'home':'general';variantId=st.variantId||null}}catch{}
window.addEventListener('pagehide',()=>{try{localStorage.setItem(KEY+'-settings',JSON.stringify(settingsSnapshot()))}catch{}});

window.addEventListener('beforeunload',e=>{if(draft&&$('#etitle')){e.preventDefault();e.returnValue=''}});if(shared){current=shared.id;openRecipe(shared.id)}else home();
</script></body></html>
