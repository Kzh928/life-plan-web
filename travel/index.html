<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅のノート｜旅先へ持っていくしおり</title><meta name="description" content="旅行の条件、旅程、予約、持ち物をひとつに。端末に保存できる旅のしおり。"><style>
:root{--ink:#203647;--muted:#6d7b83;--blue:#246a86;--bg:#f7f7f2;--line:#e1e7e4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 system-ui,sans-serif}button,input,textarea,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);padding:10px 17px}button:hover{border-color:var(--blue)}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button.danger{color:#a34737}header{height:76px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 5%;background:#fff}header b{font-size:21px;letter-spacing:.12em}header small{color:var(--muted)}main{max-width:1120px;margin:auto;padding:38px 24px 80px}.eyebrow{letter-spacing:.18em;color:var(--blue);font-size:12px;font-weight:700}h1{font-size:34px;line-height:1.4;margin:10px 0}h2{font-size:22px;margin:0 0 12px}h3{margin:0 0 8px;font-size:17px}p{margin:8px 0 18px}.muted{color:var(--muted)}.hero{padding:28px 0 35px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero p{max-width:650px}.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;background:#edf3ee;color:#47715d}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}.card{border-top:4px solid #86b6bd}.card p{white-space:pre-wrap;overflow-wrap:anywhere}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.steps{display:flex;gap:20px;border-top:1px solid var(--line);margin-top:36px;padding-top:24px}.steps div{flex:1}.steps b{color:var(--blue);margin-right:8px}.empty{text-align:center;padding:52px 24px;border:1px dashed #b9cacb;border-radius:16px;background:#f0f5f2}.empty .icon{font-size:40px}.tabs{display:flex;gap:6px;overflow:auto;border-bottom:1px solid var(--line);padding-bottom:14px;margin:22px 0}.tabs button{white-space:nowrap;background:transparent;border-color:transparent}.tabs button.active{background:var(--ink);color:white}.two{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.panel{margin-bottom:18px}label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}input,textarea,select{width:100%;border:1px solid #cad6d7;border-radius:8px;padding:10px;background:#fff;color:var(--ink)}textarea{min-height:110px;resize:vertical}input[type=checkbox]{width:auto;margin-right:10px;accent-color:var(--blue)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.item{border-left:3px solid #b9d3d6;padding:8px 0 12px 18px;margin:20px 0}.item p{white-space:pre-wrap;margin:3px 0 9px}.item small{color:var(--muted)}a{color:var(--blue)}.check{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.check span{flex:1}.check.done span{text-decoration:line-through;color:var(--muted)}dialog{border:0;border-radius:18px;padding:28px;width:min(570px,94%);max-height:90vh;overflow:auto;color:var(--ink)}dialog::backdrop{background:#18313d77}.notice{background:#eef5f5;padding:15px;border-radius:10px;font-size:13px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 24px;border-radius:10px;z-index:10}footer{color:var(--muted);font-size:12px;margin-top:30px}.small{font-size:12px}.hide{display:none}@media(max-width:720px){header{padding:0 20px}header small{display:none}main{padding:22px 16px 60px}h1{font-size:28px}.hero{display:block}.grid,.two{grid-template-columns:1fr}.steps{display:block}.steps div{margin-bottom:14px}.fields{grid-template-columns:1fr}.panel,.card{padding:20px}.hero button{margin-top:8px}}@media print{header,.tabs,button,.no-print{display:none!important}body{background:white}main{padding:0}.panel{break-inside:avoid}.two{display:block}}
</style><header><b>⌁ 旅のノート</b><small>PLAN · TAKE ALONG · EXPLORE</small><button onclick="home()">旅行一覧</button></header><main id="app"></main><dialog id="modal"></dialog><input class="hide" type="file" id="importer" accept="application/json,.json"><div id="toast" class="toast hide" role="status"></div>
<script>
// 旅行データを端末保存し，旅程・予約・持ち物・代案の編集，JSON入出力，相談文の作成を行う．外部APIは使用しない．
const KEY='tabi-note-v1';let trips=[],current=null,tab='overview';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,"0")).join("");try{trips=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(trips))throw Error()}catch{trips=[];setTimeout(()=>toast('保存データを読み込めません．バックアップを取り込んでください．'),50)}
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hide');setTimeout(()=>$('#toast').classList.add('hide'),3500)}function persist(){try{localStorage.setItem(KEY,JSON.stringify(trips));return true}catch{toast('端末への保存に失敗しました．JSONを書き出してください．');return false}}function trip(){return trips.find(t=>t.id===current)}function home(){current=null;render()}function openTrip(id){current=id;tab='overview';render()}function field(name,label,value='',type='text'){return `<label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}">`}function area(name,label,value=''){return `<label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}">${esc(value)}</textarea>`}function dialog(title,body,save){$('#modal').innerHTML=`<form id="form"><div class="row between"><h2>${title}</h2><button type="button" onclick="document.querySelector('#modal').close()">閉じる</button></div>${body}<div class="row" style="margin-top:22px"><button class="primary">保存する</button></div></form>`;$('#form').onsubmit=e=>{e.preventDefault();if(save(Object.fromEntries(new FormData(e.target)))!==false)$('#modal').close()};$('#modal').showModal()}
function editTrip(id){const t=trips.find(t=>t.id===id)||{};dialog(t.id?'旅行の基本情報':'新しい旅をはじめる',field('title','旅行の名前',t.title)+`<div class="fields">${field('start','出発日',t.start,'date')}${field('end','帰着日',t.end,'date')}${field('people','同行者・人数',t.people)}${field('budget','予算・含むもの',t.budget)}</div>`+field('from','出発地・帰着地（複数可）',t.from)+area('wishes','どんな旅行にしたい？ 未定のままでも大丈夫',t.wishes)+`<label>計画の状態</label><select name="status">${['相談中','比較中','確定'].map(x=>`<option ${t.status===x?'selected':''}>${x}</option>`).join('')}</select>`,v=>{if(!v.title.trim()){toast('旅行の名前を入れてください');return false}if(v.start&&v.end&&v.end<v.start){toast('帰着日は出発日以降にしてください');return false}if(t.id)Object.assign(t,v);else{v.id=uid();v.itinerary=[];v.bookings=[];v.packing=[];v.alternatives='';v.options='';trips.push(v);current=v.id}const ok=persist();render();return ok})}
function render(){const t=trip();if(!t){$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">YOUR TRAVEL COMPANION</div><h1>決めた旅を，<br>そのまま持っていこう．</h1><p class="muted">相談したことも，予約したことも，ひとつのノートに．<br>旅先で迷ったときも，ここから次の一歩へ．</p></div><button class="primary" onclick="editTrip()">＋ 新しい旅行</button></section><div class="row between" style="margin-bottom:18px"><h2>あなたの旅行 <span class="muted small">${trips.length}件</span></h2><div class="row"><button onclick="saveApp()">アプリ本体を保存</button><button onclick="importData()">JSON・ZIPを取り込む</button></div></div>${trips.length?`<div class="grid">${trips.map(t=>`<article class="card"><span class="tag">${esc(t.status)}</span><h2 style="margin-top:15px">${esc(t.title)}</h2><div class="muted small">${esc(t.start||'日程未定')} ${t.end?'— '+esc(t.end):''}</div><p>${esc(t.people||'同行者未定')}<br>${esc(t.from||'出発地未定')}</p><button onclick="openTrip('${t.id}')">しおりを開く →</button></article>`).join('')}</div>`:`<div class="empty"><div class="icon">⌁</div><h2>次の旅行は，ここから．</h2><p class="muted">「誰と，いつ，何をしたいか」だけで始められます．<br>質問への回答や旅行案はチャットで相談し，決まったことをこのノートへ．</p><button class="primary" onclick="editTrip()">旅行を登録する</button></div>`}<div class="steps"><div><b>01</b>希望を入れてチャットで相談</div><div><b>02</b>決まった旅程・予約を保存</div><div><b>03</b>旅先へ持っていく</div></div><footer>データはこのブラウザに保存します．別端末にはJSONで移せます．ブラウザのデータ消去に備え，定期的に書き出してください．</footer>`;return}const tabs=[['overview','旅の概要'],['itinerary','旅程'],['bookings','予約・費用'],['packing','持ち物'],['help','困ったとき']];$('#app').innerHTML=`<div class="row between"><a href="#" onclick="home();return false">← 旅行一覧</a><span class="tag">${esc(t.status)}</span></div><section class="hero" style="padding-bottom:5px"><div><div class="eyebrow">TRAVEL NOTE</div><h1>${esc(t.title)}</h1><p class="muted">${esc(t.start||'日程未定')} ${t.end?'— '+esc(t.end):''}　${esc(t.people)}</p></div><button onclick="editTrip('${t.id}')">基本情報を編集</button></section><nav class="tabs">${tabs.map(([k,n])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';render()">${n}</button>`).join('')}</nav><div id="content"></div><footer>この端末に保存 · 自動同期なし · 最新の営業・運行状況は公式情報で確認してください．</footer>`;const c=$('#content');if(tab==='overview')c.innerHTML=`<div class="two"><div><section class="panel"><h2>今回の旅</h2><label>出発地・帰着地</label><p>${esc(t.from||'未定')}</p><label>予算</label><p>${esc(t.budget||'未定')}</p><label>大切にしたいこと・条件</label><p style="white-space:pre-wrap">${esc(t.wishes||'まだありません')}</p><button class="primary" onclick="copyBrief()">相談用の条件をコピー</button></section><section class="panel"><h2>比較した案・決定事項</h2><p class="muted small">候補の良い点，懸念，費用，出典も残せます．</p><textarea aria-label="比較した案" id="options">${esc(t.options)}</textarea><button style="margin-top:12px" onclick="saveText('options')">メモを保存</button></section></div><aside><section class="panel"><h3>持ち歩く準備</h3><p class="muted small">確定した計画をJSONで保存．読みやすい旅程表は印刷画面からPDFにできます．</p><div class="row"><button onclick="download()">JSON書き出し</button><button onclick="printTrip()">旅程表・PDF</button><button onclick="importData()">JSON・ZIP取り込み</button></div></section><section class="notice">予約番号・添付資料はこの端末に保存されます．書き出したJSONの共有先は，自分で選んでください．</section><button class="danger" style="margin-top:22px" onclick="deleteTrip()">この旅行を削除</button></aside></div>`;
if(tab==='itinerary')c.innerHTML=`<div class="row between"><div><h2>日ごとの旅程</h2><p class="muted small">移動・食事・休憩も，ひとつの予定として残せます．</p></div><button class="primary" onclick="editItem('itinerary')">＋ 予定を追加</button></div>${t.itinerary.length?t.itinerary.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(x=>`<section class="panel"><div class="row between"><span class="eyebrow">${esc(x.date||'日付未定')}　${esc(x.time)} ${x.endtime?'— '+esc(x.endtime):''}</span><span class="tag">${esc(x.priority)}</span></div><h3>${esc(x.title)}</h3><p style="white-space:pre-wrap">${esc(x.notes)}</p>${link(x.url,'地図・詳細を開く')}<div class="row" style="margin-top:12px"><button onclick="editItem('itinerary','${x.id}')">編集</button><button onclick="removeItem('itinerary','${x.id}')">削除</button></div></section>`).join(''):`<div class="empty">予定はまだありません．チャットで決めた行程を登録しましょう．</div>`}`;
if(tab==='bookings')c.innerHTML=`<div class="row between"><h2>予約・費用</h2><button class="primary" onclick="editItem('bookings')">＋ 予約を追加</button></div><p class="muted small">登録額の合計：${t.bookings.reduce((a,x)=>a+(Number(x.cost)||0),0).toLocaleString()}円（各予約に入力した金額の合計）</p>${t.bookings.map(x=>`<section class="panel"><div class="row between"><h3>${esc(x.title)}</h3><span class="tag">${esc(x.state)}</span></div><p>${esc(x.date)} ${esc(x.time)} ／ ${Number(x.cost||0).toLocaleString()}円</p><p style="white-space:pre-wrap">${esc(x.notes)}</p>${link(x.url,'予約・公式ページ')}${x.file?`<p><a download="${esc(x.filename)}" href="${x.file}">添付：${esc(x.filename)}</a></p>`:''}<div class="row"><button onclick="editItem('bookings','${x.id}')">編集</button><button onclick="attach('${x.id}')">資料を添付</button><button onclick="removeItem('bookings','${x.id}')">削除</button></div></section>`).join('')||'<div class="empty">宿・交通・食事・体験の予約をまとめましょう．</div>'}`;
if(tab==='packing')c.innerHTML=`<div class="row between"><h2>持ち物・出発前チェック</h2><span class="tag">${t.packing.filter(x=>x.done).length} / ${t.packing.length}</span></div><section class="panel"><form onsubmit="addPacking(event)" class="row"><input name="item" aria-label="持ち物" placeholder="持ち物や準備を入力" required style="flex:1"><button class="primary">追加</button></form>${t.packing.map(x=>`<div class="check ${x.done?'done':''}"><input aria-label="${esc(x.title)}" type="checkbox" ${x.done?'checked':''} onchange="togglePack('${x.id}')"><span>${esc(x.title)}</span><button onclick="removeItem('packing','${x.id}')">削除</button></div>`).join('')}</section>`;
if(tab==='help')c.innerHTML=`<div class="two"><section class="panel"><div class="eyebrow">WHEN PLANS CHANGE</div><h2>今の状況から，考え直す．</h2><p class="muted">計画と困り事をコピーして，この旅行のチャットに貼り付けて相談できます．このサイト内でAIは動きません．</p>${field('where','現在地・時刻（手入力）')}${area('problem','何が起きた？','')}${area('keep','守りたい予約・予定／体調や希望','')}<button class="primary" style="margin-top:18px" onclick="copyHelp()">計画と状況をコピー</button><p class="small muted">コピーした内容を確認してから送ってください．予約番号と添付資料は相談文に含めません．位置情報の自動取得・運行状況の監視は行いません．</p></section><section class="panel"><h2>雨・疲れ・遅延の代案</h2><p class="muted small">省略できる場所，休憩場所，早く宿へ戻る経路，連絡先など．</p><textarea id="alternatives" style="min-height:260px" aria-label="代案">${esc(t.alternatives)}</textarea><button style="margin-top:12px" onclick="saveText('alternatives')">代案を保存</button></section></div>`}
function link(u,label){try{const x=new URL(u);if(!['https:','http:'].includes(x.protocol))return '';return `<a href="${esc(x.href)}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`}catch{return ''}}
function saveText(k){trip()[k]=$('#'+k).value;if(persist())toast('保存しました')}
function editItem(kind,id){const t=trip(),x=t[kind].find(x=>x.id===id)||{};let body=field('title',kind==='bookings'?'予約名（宿・交通・食事など）':'予定の名前',x.title)+`<div class="fields">${field('date','日付',x.date||t.start,'date')}${field('time','開始時刻',x.time,'time')}</div>`;if(kind==='itinerary')body+=field('endtime','終了時刻',x.endtime,'time')+`<label>優先度</label><select name="priority">${['必ず行く','できれば行く','時間が余れば'].map(v=>`<option ${x.priority===v?'selected':''}>${v}</option>`).join('')}</select>`;else body+=field('cost','金額（円）・この予約全体または1人分かは詳細に記載',x.cost,'number')+`<label>予約・支払い状態</label><select name="state">${['未予約','予約済・未払い','支払い済','キャンセル'].map(v=>`<option ${x.state===v?'selected':''}>${v}</option>`).join('')}</select>`;body+=field('url','地図・公式・予約ページURL',x.url,'url')+area('notes',kind==='bookings'?'予約番号・連絡先・期限・取消条件・費用の対象':'経路・乗り場・滞在時間・費用・出典・確認日',x.notes);dialog(id?'内容を編集':'新しく登録',body,v=>{if(!v.title.trim()){toast('名前を入れてください');return false}if(id)Object.assign(x,v);else t[kind].push({...v,id:uid()});const ok=persist();render();return ok})}
function removeItem(k,id){if(!confirm('この項目を削除しますか？'))return;trip()[k]=trip()[k].filter(x=>x.id!==id);persist();render()}function deleteTrip(){if(!confirm('この旅行を削除しますか？先にJSONを書き出すと復元できます．'))return;trips=trips.filter(t=>t.id!==current);persist();home()}function addPacking(e){e.preventDefault();trip().packing.push({id:uid(),title:e.target.item.value.trim(),done:false});persist();render()}function togglePack(id){const x=trip().packing.find(x=>x.id===id);x.done=!x.done;persist();render()}
function brief(t){return `旅行名：${t.title}\n日程：${t.start||'未定'}〜${t.end||'未定'}\n人数・同行者：${t.people}\n出発・帰着地：${t.from}\n予算：${t.budget}\n希望・制約：${t.wishes}\n状態：${t.status}`}async function copy(text){try{await navigator.clipboard.writeText(text);toast('コピーしました．旅行のチャットに貼り付けてください．')}catch{dialog('この文章を選択してコピー',area('copy','相談文',text),()=>{})}}function copyBrief(){copy('旅行を計画したいです．不足する条件を少数ずつ質問し，性格の違う3〜5案を比較してください．\n\n'+brief(trip()))}function copyHelp(){const t=trip();copy('旅行中の予定変更を相談します．予約・固定予定を確認し，実行可能な代案と追加費用・時刻への影響を教えてください．\n\n'+brief(t)+'\n\n現在地・時刻：'+$('#f-where').value+'\n困り事：'+$('#f-problem').value+'\n守りたい予定・希望：'+$('#f-keep').value+'\n\n旅程：\n'+t.itinerary.map(x=>`${x.date} ${x.time} ${x.title}（${x.priority}）\n${x.notes}`).join('\n')+'\n\n予約一覧（詳細・番号は除外）：\n'+t.bookings.map(x=>`${x.date} ${x.time} ${x.title} ${x.state}`).join('\n')+'\n\n用意した代案：\n'+t.alternatives)}
function saveApp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["<!doctype html>"+document.documentElement.outerHTML.replace(/<dialog[\s\S]*?<\/dialog>/,"<dialog id=\"modal\"></dialog>")],{type:"text/html"}));a.download="tabi-note.html";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("アプリ本体を保存しました．旅行データはJSONでも書き出してください．")}
function download(){const data={format:'tabi-note',version:1,exportedAt:new Date().toISOString(),trips:current?[trip()]:trips};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='tabi-note-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('JSONを書き出しました．ダウンロード先を確認してください．')}
function importData(){$('#importer').click()}$('#importer').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=JSON.parse(await f.text());if(d.format!=='tabi-note'||d.version!==1||!Array.isArray(d.trips)||!d.trips.length)throw Error();const incoming=d.trips.map(t=>{if(typeof t.title!=='string'||!['itinerary','bookings','packing'].every(k=>Array.isArray(t[k])))throw Error();const clean={id:uid(),title:t.title,status:['相談中','比較中','確定'].includes(t.status)?t.status:'相談中'};for(const k of ['start','end','people','budget','from','wishes','options','alternatives'])clean[k]=typeof t[k]==='string'?t[k]:'';for(const k of ['itinerary','bookings','packing'])clean[k]=t[k].map(x=>{if(!x||typeof x.title!=='string')throw Error();const v={id:uid(),title:x.title};for(const n of ['date','time','endtime','priority','notes','url','state','filename'])if(typeof x[n]==='string')v[n]=x[n];v.cost=Math.max(0,Number(x.cost)||0);v.done=x.done===true;if(typeof x.file==='string'&&/^data:(application\/pdf|image\/(png|jpeg|webp));base64,[A-Za-z0-9+/=]+$/.test(x.file))v.file=x.file;return v});return clean});if(!confirm(`${incoming.length}件を新しい旅行として追加します．同名の旅行も上書きしません．よろしいですか？`))return;trips.push(...incoming);persist();home();toast('取り込みました．更新版は新しい旅行として追加しています．')}catch{toast('読み込めません．旅のノート形式のJSONを選んでください．')}};
function attach(id){const i=document.createElement('input');i.type='file';i.accept='application/pdf,image/png,image/jpeg,image/webp';i.onchange=()=>{const f=i.files[0];if(!f)return;if(!['application/pdf','image/png','image/jpeg','image/webp'].includes(f.type)||f.size>1500000){toast('PDF・画像を1.5MB以下で選んでください');return}const r=new FileReader();r.onload=()=>{const x=trip().bookings.find(x=>x.id===id);const old={file:x.file,filename:x.filename};x.file=r.result;x.filename=f.name;if(!persist())Object.assign(x,old);render()};r.readAsDataURL(f)};i.click()}
function printTrip(){const t=trip();const win=window.open('','_blank');if(!win){toast('ポップアップを許可して再度お試しください');return}win.document.write(`<!doctype html><meta charset="utf-8"><title>${esc(t.title)} 旅程表</title><style>body{font:14px/1.8 sans-serif;padding:30px;color:#203647}pre{white-space:pre-wrap;font:inherit}section{break-inside:avoid;border-top:1px solid #ccc;padding:14px 0}button{padding:12px}@media print{button{display:none}}</style><button onclick="print()">印刷・PDFとして保存</button><h1>${esc(t.title)}</h1><pre>${esc(brief(t))}</pre><h2>旅程</h2>${t.itinerary.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(x=>`<section><b>${esc(x.date)} ${esc(x.time)} ${esc(x.title)}</b><pre>${esc(x.notes)}</pre>${link(x.url,'地図・詳細')}</section>`).join('')}<h2>予約・費用</h2>${t.bookings.map(x=>`<section><b>${esc(x.title)} ${esc(x.date)} ${esc(x.time)}</b><p>${esc(x.state)} ${Number(x.cost||0).toLocaleString()}円</p><pre>${esc(x.notes)}</pre>${link(x.url,'予約・公式')}</section>`).join('')}<h2>代案・連絡先</h2><pre>${esc(t.alternatives)}</pre><h2>持ち物</h2>${t.packing.map(x=>`<div>${x.done?'✓':'□'} ${esc(x.title)}</div>`).join('')}<p>作成日時：${esc(new Date().toLocaleString('ja-JP'))} ／ 最新の運行・営業状況は別途確認．添付ファイルはJSONに含まれます．</p>`);win.document.close()}
render();

// 全件バックアップ，添付実体の検証，ZIP入出力，保存失敗時の巻き戻し．通信は行わない．
const LIMIT=40*1024*1024, te=new TextEncoder(), td=new TextDecoder('utf-8',{fatal:true});
let committed=JSON.stringify(trips), importCandidate=null;
function persist(){try{const data=JSON.stringify(trips);localStorage.setItem(KEY,data);committed=data;return true}catch{trips=JSON.parse(committed);toast('保存容量が足りないため変更を取り消しました．先に全件を書き出してください．');return false}}
function counts(ts){return {trips:ts.length,itinerary:ts.reduce((n,t)=>n+t.itinerary.length,0),bookings:ts.reduce((n,t)=>n+t.bookings.length,0),packing:ts.reduce((n,t)=>n+t.packing.length,0),files:ts.reduce((n,t)=>n+t.bookings.filter(x=>x.file).length,0)}}
function countLabel(ts){const c=counts(ts);return `旅行 ${c.trips}件・予定 ${c.itinerary}件・予約 ${c.bookings}件・持ち物 ${c.packing}件・添付 ${c.files}件`}
function saveBlob(blob,name){const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function bundle(ts){return {format:'tabi-note',version:1,exportedAt:new Date().toISOString(),trips:ts}}
function stamp(){return new Date().toISOString().replace(/[:.]/g,'-')}
function backupJSON(){saveBlob(new Blob([JSON.stringify(bundle(trips),null,2)],{type:'application/json'}),'tabi-note-all-'+stamp()+'.json');toast('全旅行のJSONを作成しました．ファイルの保存を確認してください．')}
function download(){saveBlob(new Blob([JSON.stringify(bundle(current?[trip()]:trips),null,2)],{type:'application/json'}),'tabi-note-'+stamp()+'.json');toast('JSONを作成しました．添付の写真・PDFも含みます．')}
function bytes64(s){const b=atob(s),v=new Uint8Array(b.length);for(let i=0;i<b.length;i++)v[i]=b.charCodeAt(i);return v}
function to64(v){let s='';for(let i=0;i<v.length;i+=8192)s+=String.fromCharCode(...v.subarray(i,i+8192));return btoa(s)}
function fileBytes(file){const m=/^data:(application\/pdf|image\/(?:png|jpeg|webp));base64,([A-Za-z0-9+/]+={0,2})$/.exec(file);if(!m||m[2].length%4)throw Error('添付の形式が不正です');const v=bytes64(m[2]);if(!v.length||v.length>1500000)throw Error('添付は1件1.5MB以下です');const head=String.fromCharCode(...v.subarray(0,12));const valid=m[1]==='application/pdf'?head.startsWith('%PDF-'):m[1]==='image/png'?v[0]===137&&head.slice(1,8)==='PNG\r\n\x1a\n':m[1]==='image/jpeg'?v[0]===255&&v[1]===216&&v[2]===255:head.startsWith('RIFF')&&head.slice(8,12)==='WEBP';if(!valid)throw Error('添付の中身がPDF・画像の形式と一致しません');return {mime:m[1],bytes:v}}
function safeID(x){return typeof x==='string'&&/^[a-zA-Z0-9_-]{1,80}$/.test(x)}
function validateData(d){
 if(!d||d.format!=='tabi-note'||d.version!==1||!Array.isArray(d.trips)||d.trips.length>10000)throw Error('旅のノート形式のJSONではありません');
 const ids=new Set(),id=x=>{const v=safeID(x)?x:uid();if(ids.has(v))throw Error('IDが重複しています');ids.add(v);return v};
 return d.trips.map(t=>{if(!t||typeof t.title!=='string'||!t.title.trim()||!['itinerary','bookings','packing'].every(k=>Array.isArray(t[k])))throw Error('旅行名または項目一覧が不正です');const v={id:id(t.id),title:t.title,status:['相談中','比較中','確定'].includes(t.status)?t.status:'相談中'};
 for(const k of ['start','end','people','budget','from','wishes','options','alternatives']){if(t[k]!=null&&typeof t[k]!=='string')throw Error('項目の型が不正です');v[k]=t[k]||''}
 if(v.start&&v.end&&v.end<v.start)throw Error('帰着日が出発日より前です');
 for(const k of ['itinerary','bookings','packing'])v[k]=t[k].map(x=>{if(!x||typeof x.title!=='string')throw Error('予定・予約・持ち物が不正です');const y={id:id(x.id),title:x.title};for(const n of ['date','time','endtime','priority','notes','url','state','filename']){if(x[n]!=null&&typeof x[n]!=='string')throw Error('項目の型が不正です');if(typeof x[n]==='string')y[n]=x[n]}
 if(x.cost!=null&&(!['number','string'].includes(typeof x.cost)||!Number.isFinite(Number(x.cost))||Number(x.cost)<0))throw Error('金額が不正です');y.cost=Number(x.cost)||0;y.done=x.done===true;
 if(x.file!=null){if(k!=='bookings'||typeof x.file!=='string')throw Error('添付先が不正です');fileBytes(x.file);y.file=x.file}return y});return v});
}
function crc32(v){let c=0xffffffff;for(const b of v){c^=b;for(let j=0;j<8;j++)c=(c>>>1)^(0xedb88320&-(c&1))}return (c^0xffffffff)>>>0}
// 無圧縮ZIP．標準ZIPツールでも開け，外部ライブラリ/CDNは不要．
function makeZip(entries){let offset=0;const parts=[],central=[];for(const [name,data]of entries){const n=te.encode(name),c=crc32(data),h=new Uint8Array(30+n.length),d=new DataView(h.buffer);d.setUint32(0,0x04034b50,true);d.setUint16(4,20,true);d.setUint16(6,0x800,true);d.setUint32(14,c,true);d.setUint32(18,data.length,true);d.setUint32(22,data.length,true);d.setUint16(26,n.length,true);h.set(n,30);parts.push(h,data);const z=new Uint8Array(46+n.length),q=new DataView(z.buffer);q.setUint32(0,0x02014b50,true);q.setUint16(4,20,true);q.setUint16(6,20,true);q.setUint16(8,0x800,true);q.setUint32(16,c,true);q.setUint32(20,data.length,true);q.setUint32(24,data.length,true);q.setUint16(28,n.length,true);q.setUint32(42,offset,true);z.set(n,46);central.push(z);offset+=h.length+data.length}const size=central.reduce((n,x)=>n+x.length,0),end=new Uint8Array(22),d=new DataView(end.buffer);d.setUint32(0,0x06054b50,true);d.setUint16(8,entries.length,true);d.setUint16(10,entries.length,true);d.setUint32(12,size,true);d.setUint32(16,offset,true);return new Blob([...parts,...central,end],{type:'application/zip'})}
function readZip(bytes){const d=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),files=new Map();let p=0;while(p+4<=bytes.length&&d.getUint32(p,true)===0x04034b50){if(p+30>bytes.length)throw Error('ZIPが途中で切れています');const flags=d.getUint16(p+6,true),method=d.getUint16(p+8,true),crc=d.getUint32(p+14,true),size=d.getUint32(p+18,true),raw=d.getUint32(p+22,true),nl=d.getUint16(p+26,true),el=d.getUint16(p+28,true),begin=p+30+nl+el,end=begin+size;if(method!==0||(flags&9)||size!==raw)throw Error('このアプリから書き出した無圧縮ZIPを選んでください');if(end>bytes.length)throw Error('ZIPが途中で切れています');const name=td.decode(bytes.subarray(p+30,p+30+nl));if(files.has(name)||!name||name.includes('..')||name.startsWith('/'))throw Error('ZIP内のファイル名が不正です');const value=bytes.slice(begin,end);if(crc32(value)!==crc)throw Error('ZIP内のファイルが破損しています');files.set(name,value);p=end;if(files.size>20000)throw Error('ZIP内のファイルが多すぎます')}
 if(p+4>bytes.length||d.getUint32(p,true)!==0x02014b50||bytes.length<22||d.getUint32(bytes.length-22,true)!==0x06054b50||d.getUint16(bytes.length-12,true)!==files.size)throw Error('ZIPの末尾または件数が不正です');return files}
async function digest(v){return [...new Uint8Array(await crypto.subtle.digest('SHA-256',v))].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function makeBackupZip(ts){const clean=validateData(bundle(ts)),entries=[],meta=[];let i=0;for(const t of clean)for(const x of t.bookings)if(x.file){const {mime,bytes}=fileBytes(x.file),path=`attachments/${++i}.${mime==='application/pdf'?'pdf':mime.split('/')[1]}`;entries.push([path,bytes]);meta.push({path,mime,sha256:await digest(bytes),size:bytes.length});delete x.file;x.fileRef=path}entries.unshift(['data.json',te.encode(JSON.stringify({...bundle(clean),zipFormat:1,attachments:meta},null,2))]);const zip=makeZip(entries);if(zip.size>LIMIT)throw Error('バックアップが40MBを超えています．旅行ごとにJSONを書き出してください');return zip}
async function parseBackup(file){if(file.size>LIMIT)throw Error('40MB以下のファイルを選んでください');const b=new Uint8Array(await file.arrayBuffer());if(b[0]===80&&b[1]===75){const z=readZip(b);if(!z.has('data.json'))throw Error('data.jsonが見つかりません');const d=JSON.parse(td.decode(z.get('data.json')));if(d.zipFormat!==1||!Array.isArray(d.attachments)||!Array.isArray(d.trips))throw Error('バックアップZIPの形式が不正です');const refs=new Map();for(const m of d.attachments){const v=z.get(m.path);if(refs.has(m.path)||!v||v.length!==m.size||await digest(v)!==m.sha256)throw Error('添付ファイルが不足・破損しています');refs.set(m.path,{file:`data:${m.mime};base64,${to64(v)}`,used:0})}for(const t of d.trips){if(!Array.isArray(t.bookings))throw Error('予約一覧が不正です');for(const x of t.bookings)if(x.fileRef){const a=refs.get(x.fileRef);if(!a)throw Error('添付の関連付けが不正です');x.file=a.file;a.used++;delete x.fileRef}}if([...refs.values()].some(x=>x.used!==1)||z.size!==refs.size+1)throw Error('添付の件数が一致しません');return validateData(d)}return validateData(JSON.parse(td.decode(b)))}
async function backupZIP(){try{saveBlob(await makeBackupZip(trips),'tabi-note-all-'+stamp()+'.zip');toast('写真・PDF入りの全件ZIPを作成しました．保存を確認してください．')}catch(e){toast(e.message)}}
function importData(){const f=$('#importer');f.accept='.json,.zip,application/json,application/zip';f.click()}
$('#importer').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{importCandidate=await parseBackup(f);$('#modal').innerHTML=`<h2>取り込む内容を確認</h2><p>${esc(countLabel(importCandidate))}</p><p class="small muted">写真・PDFの実体と関連付けを検証しました．</p><label>取り込み方法</label><select id="restore-mode"><option value="add">別の旅行として追加（既存分を残す）</option><option value="replace">全件を置き換えて復元</option></select><p class="notice">取り込み前に，現在の全旅行をJSONでダウンロードします．保存できたことを確認してから復元してください．</p><button onclick="backupJSON();document.querySelector('#backup-confirm').disabled=false">① 現在の全件JSONを保存</button><label><input type="checkbox" id="backup-confirm" disabled>バックアップをファイルに保存できた</label><div class="row"><button class="primary" onclick="commitImport()">② 取り込む</button><button onclick="importCandidate=null;document.querySelector('#modal').close()">やめる</button></div>`;$('#modal').showModal()}catch(e){importCandidate=null;toast('取り込めません：'+e.message)}};
function commitImport(){if(!importCandidate||!$('#backup-confirm').checked){toast('先にバックアップを保存して確認してください');return}const replace=$('#restore-mode').value==='replace';if(replace&&!confirm('現在の全旅行を，確認したバックアップの内容に置き換えますか？'))return;const incoming=structuredClone(importCandidate);if(!replace)for(const t of incoming){t.id=uid();for(const k of ['itinerary','bookings','packing'])for(const x of t[k])x.id=uid()}trips=replace?incoming:[...trips,...incoming];if(!persist()){render();return}const label=countLabel(incoming);importCandidate=null;$('#modal').close();home();toast('保存・復元しました：'+label)}
// 自分の端末内にある画面・予約情報をアプリ本体へ焼き込まない．
async function saveApp(){try{const response=await fetch(location.href.split('#')[0],{cache:'no-store'});if(!response.ok)throw Error();const html=await response.text();saveBlob(new Blob([html],{type:'text/html'}),'tabi-note.html');toast('アプリ本体を作成しました．データは全件JSONで別に保存してください．')}catch{toast('アプリ本体を取得できません．まず全件JSONを保存してください．')}}
const baseRender=render;render=function(){baseRender();if(!trip()){const row=document.createElement('section');row.className='panel';row.innerHTML='<h3>全旅行のバックアップ・移行</h3><p class="small muted">写真・PDF本体，予約のメモ，旅程，持ち物をまとめて保存します．元サイトの「JSON書き出し」も取り込めます．自動同期はありません．</p><div class="row"><button onclick="backupJSON()">全件JSONを書き出す</button><button onclick="backupZIP()">写真・PDF入り全件ZIP</button><button onclick="importData()">JSON・ZIPから復元</button></div><p class="small muted">端末の保存容量に収まる範囲で利用できます．添付は1件1.5MBまで．ファイルを保存した後，復元できるか確認して保管してください．</p>';$('#app').append(row)}else{document.querySelectorAll('#content a[download]').forEach(a=>{const x=trip().bookings.find(x=>x.filename===a.download&&x.file===a.getAttribute('href'));if(x)a.onclick=e=>{e.preventDefault();const {bytes,mime}=fileBytes(x.file);saveBlob(new Blob([bytes],{type:mime}),x.filename||'attachment')}})}};
render();
