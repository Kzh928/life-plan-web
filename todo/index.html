<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b27"><title>QUEST LOG — やることを、冒険に。</title><style>
:root{color-scheme:dark;--bg:#0c211f;--panel:#16332e;--gold:#dfbd72;--ink:#f3eddb;--muted:#a6bab0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#254c3e,transparent 65%),var(--bg);color:var(--ink);font-family:system-ui,sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer;min-height:46px;border:1px solid #65725a;border-radius:9px;background:#22473c;color:var(--ink);padding:10px 16px}button:hover{border-color:var(--gold)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold)}.gold{background:var(--gold);color:#192e25;border-color:var(--gold);font-weight:700}main{max-width:840px;margin:auto;padding:28px 20px 100px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}.eyebrow{color:var(--gold);letter-spacing:.22em;font-size:12px}h1{font-family:serif;font-size:clamp(36px,7vw,56px);letter-spacing:.05em;margin:8px 0}p{color:var(--muted);line-height:1.7}.hero{padding:32px 0 24px;border-bottom:1px solid #55654b}.hero p{margin:0}.stats{display:flex;gap:25px;margin:22px 0;color:var(--muted)}.stats strong{color:var(--gold);font-size:25px;margin-right:6px}#missing{width:100%;text-align:left;background:#534529;border-color:#9a7b43;margin-bottom:18px;color:#ffe0a0}nav{display:flex;gap:8px;margin:24px 0 18px;flex-wrap:wrap}nav button.active{color:var(--gold);border-color:var(--gold)}.quick{display:flex;gap:10px}input,textarea{width:100%;background:#0c2522;color:var(--ink);border:1px solid #586c5c;padding:13px;border-radius:8px;min-width:0}input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold)}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-bottom:1px solid #3a5445;padding:5px 0}.task{text-align:left;background:transparent;border:0;padding:18px 8px;min-width:0}.task strong{display:block;overflow-wrap:anywhere;font-size:17px;font-weight:600}.task small{display:block;color:var(--muted);margin-top:7px}.task small.urgent{color:#ffbd83}.empty{text-align:center;padding:58px 20px;border:1px dashed #5c6c51;border-radius:12px;margin-top:22px}.empty b{font-family:serif;font-size:23px;color:var(--gold)}dialog{background:#17342e;color:var(--ink);border:1px solid var(--gold);border-radius:16px;max-width:560px;width:calc(100% - 24px);padding:25px;max-height:90dvh;overflow:auto}dialog::backdrop{background:#03110de0;backdrop-filter:blur(5px)}label{display:block;margin:18px 0 6px;color:#dfdec8}textarea{resize:vertical;min-height:96px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.topline{display:flex;align-items:center;justify-content:space-between}.switch{display:flex;gap:14px;align-items:center}.switch label{margin:0}.subtle{font-size:12px}.danger{color:#ffb5a1}#notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:14px 20px;background:#dfbd72;color:#152d25;border-radius:10px;z-index:30;max-width:90%;text-align:center}#fx{position:fixed;inset:0;margin:0;width:100vw;max-width:none;height:100dvh;max-height:none;border:0;border-radius:0;z-index:100;background:#05120ddf;display:grid;place-content:center;text-align:center;overflow:hidden;cursor:pointer}#fx[hidden],[hidden]{display:none!important}.stamp{color:#ffe3a0;border:8px double currentColor;padding:24px;font-family:serif;font-weight:900;font-size:clamp(36px,9vw,84px);transform:rotate(-9deg);animation:slam 1s both;text-shadow:0 0 24px #f3b94a;box-shadow:0 0 70px #eabd4266;max-width:92vw}#fx small{color:var(--gold);letter-spacing:.3em;margin-top:45px;z-index:1}#fx p{max-width:85vw;margin:35px auto;color:white;overflow-wrap:anywhere}.rays{position:absolute;inset:-70%;background:repeating-conic-gradient(from 0deg,transparent 0deg 15deg,#edc86a18 15deg 22deg);animation:spin 12s linear infinite;pointer-events:none}.spark{position:absolute;width:7px;height:16px;background:var(--gold);left:50%;top:50%;animation:burst 2s ease-out both;transform:rotate(var(--a)) translateY(-45vh)}body.impact{animation:shake .4s .5s}@keyframes slam{0%{opacity:0;transform:scale(4) rotate(-25deg)}45%{opacity:1;transform:scale(1.12) rotate(-9deg)}58%{transform:scale(.95) rotate(-9deg)}100%{transform:scale(1) rotate(-9deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes shake{25%{transform:translate(7px,-5px)}50%{transform:translate(-7px,4px)}75%{transform:translate(4px,-2px)}}@keyframes burst{from{opacity:1;transform:rotate(var(--a)) translateY(0)}to{opacity:0;transform:rotate(var(--a)) translateY(-65vh)}}@media(max-width:480px){main{padding:20px 16px 80px}.hero{padding:24px 0}header button{padding:8px 12px}.quick button{white-space:nowrap}.stats{gap:18px}}@media(prefers-reduced-motion:reduce){.stamp{animation:none}.rays,.spark{display:none}body.impact{animation:none}}

/* An inked quest seal, with a deliberate wind-up and a single heavy impact. */
#fx{--seal:#af372c;background:radial-gradient(ellipse at center,#dfd1aa18,transparent 64%),#07150ec4;backdrop-filter:blur(3px);padding:0;isolation:isolate;place-items:center;place-content:center}
#fx::backdrop{background:#07120d33}
#fx[data-kind="start"]{--seal:#295d46}#fx[data-kind="warning"]{--seal:#8c5624}
#fx .stamp{position:relative;width:min(700px,94vw);height:auto;aspect-ratio:600/390;max-width:94vw;border:0;padding:0;box-shadow:none;text-shadow:none;color:var(--seal);font-family:Georgia,'Yu Mincho','Hiragino Mincho ProN',serif;transform:rotate(-7deg);animation:inkSlam 4.9s both;filter:drop-shadow(0 2px 0 #f9edc8aa);z-index:3}
.seal-art{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.seal-en{position:absolute;left:17%;right:17%;top:33%;text-align:center;font-size:clamp(21px,6.8vw,53px);font-weight:900;letter-spacing:-.035em;line-height:1;transform:scaleY(1.12)}
.seal-jp{position:absolute;left:17%;right:17%;top:48%;font-size:clamp(22px,6vw,46px);font-weight:900;letter-spacing:.07em;white-space:nowrap;line-height:1.2}
.seal-caption{position:absolute;top:65%;left:18%;right:18%;font-size:clamp(7px,1.7vw,12px);letter-spacing:.18em;font-weight:700}
#fx p{margin:-10px 24px 0;max-width:min(580px,85vw);font-size:clamp(16px,3.8vw,22px);font-family:serif;letter-spacing:.06em;color:#f2e4bc;animation:afterglow 4.9s both;z-index:4;text-shadow:0 2px 5px #000}
#fx small{margin-top:30px;color:#d8c89a;font-size:11px;letter-spacing:.18em;animation:afterglow 4.9s both}
.ink-bloom{position:absolute;width:min(690px,100vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(ellipse,#efe2b9c9 0%,#e5d3a6b8 30%,#cfb98566 48%,transparent 69%);animation:paperBloom 4.9s both;z-index:1;pointer-events:none}
.impact-ring{position:absolute;width:70px;height:70px;border:3px solid #f6e5b1;border-radius:50%;animation:shockwave 4.9s both;z-index:2;pointer-events:none}
.impact-flash{position:absolute;inset:0;background:#f9efd1;animation:hitFlash 4.9s both;pointer-events:none;z-index:5}
#fx .spark{width:4px;height:4px;border-radius:50%;background:#dec28a;animation:dust 2.1s .59s both;z-index:2;pointer-events:none}
body.impact{animation:shake .26s .59s}
@keyframes inkSlam{0%,7%{opacity:0;transform:scale(2.8) rotate(-18deg);filter:blur(5px)}11%{opacity:1;transform:scale(1.7) rotate(-12deg);filter:blur(2px)}12%{opacity:1;transform:scale(.96) rotate(-7deg);filter:blur(0)}15%{transform:scale(1.035) rotate(-7deg)}19%,85%{opacity:1;transform:scale(1) rotate(-7deg)}100%{opacity:0;transform:scale(1.025) rotate(-7deg)}}
@keyframes paperBloom{0%,11%{opacity:0;transform:scale(.3)}14%{opacity:1;transform:scale(1.03)}25%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
@keyframes shockwave{0%,11%{opacity:0;transform:scale(.3)}12%{opacity:.8;transform:scale(1)}24%{opacity:0;transform:scale(15)}100%{opacity:0;transform:scale(15)}}
@keyframes hitFlash{0%,11%{opacity:0}12%{opacity:.75}17%,100%{opacity:0}}
@keyframes afterglow{0%,20%{opacity:0;transform:translateY(8px)}30%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes dust{0%{opacity:0;transform:rotate(var(--a)) translateY(35px)}8%{opacity:.9}100%{opacity:0;transform:rotate(var(--a)) translateY(min(43vw,340px))}}
@media(prefers-reduced-motion:reduce){#fx .stamp{animation:none;transform:rotate(-7deg);opacity:1;filter:none}.ink-bloom,#fx p,#fx small{animation:none;opacity:1}.impact-ring,.impact-flash,#fx .spark{display:none}}

.reference-seal{display:none}
#fx[data-kind="clear"] .stamp{width:min(900px,96vw);aspect-ratio:1920/1200;filter:none;transform:rotate(-5deg)}
#fx[data-kind="clear"] .reference-seal{display:block;width:100%;height:auto}
#fx[data-kind="clear"] .seal-art,#fx[data-kind="clear"] .seal-en,#fx[data-kind="clear"] .seal-jp,#fx[data-kind="clear"] .seal-caption{display:none}
#fx[data-kind="clear"] .ink-bloom{display:none}
#fx[data-kind="clear"]{background:#06120ce8}
@media(prefers-reduced-motion:reduce){#fx[data-kind="clear"] .stamp{transform:rotate(-5deg)}}
</style><main><header><div class="eyebrow">YOUR DAILY ADVENTURE</div><button id="settingsBtn">⚙ 設定</button></header><section class="hero"><div class="eyebrow">日常のクエストボード</div><h1>QUEST LOG</h1><p>ひとつ終えるたび、前へ進んでいる。</p></section><div class="stats" id="stats"></div><button id="missing" hidden></button><div class="quick"><input id="quickTitle" aria-label="追加するタイトル" placeholder="今日のクエストを入力…" maxlength="300"><button class="gold" id="add">＋ 追加</button></div><nav aria-label="一覧の切り替え"><button class="active" data-filter="open">未達成</button><button data-filter="active">進行中</button><button data-filter="done">達成済み</button></nav><section id="list" aria-live="polite"></section><p class="subtle">タイトルをタップすると、期日・詳細・コメントを編集できます。<br>データはこのブラウザに自動保存されます。</p></main>
<dialog id="editor"><div class="topline"><h2 id="editHeading">クエスト詳細</h2><button id="closeEditor" aria-label="詳細を閉じる">✕</button></div><label for="title">タイトル（必須）</label><input id="title" maxlength="300"><label for="due">期日（任意）</label><input id="due" type="date"><label for="detail">詳細（任意）</label><textarea id="detail"></textarea><label for="comment">コメント（任意）</label><textarea id="comment"></textarea><div class="actions"><button class="gold" id="save">保存</button><button id="start">⚔ 開始する</button><button id="complete">✓ 達成する</button><button class="danger" id="delete">削除</button></div></dialog>
<dialog id="settings"><div class="topline"><h2>設定とバックアップ</h2><button id="closeSettings" aria-label="設定を閉じる">✕</button></div><div class="switch"><input type="checkbox" id="effects"><label for="effects">演出 ON</label></div><p>達成スタンプ・開始・期日前の演出をまとめて切り替えます。</p><div class="switch"><input type="checkbox" id="sound"><label for="sound">効果音 ON</label></div><div class="actions"><button id="preview">達成演出を試す</button><button id="export">JSONを書き出す</button><button id="import">JSONを読み込む</button></div><input id="importFile" type="file" accept="application/json,.json" hidden><p class="subtle">機種変更やブラウザのデータ削除に備え、時々書き出してください。読み込みは既存データを置き換えます。</p></dialog><dialog id="missingDialog"><div class="topline"><h2>！ 期日を決めよう</h2><button id="closeMissing" aria-label="未設定一覧を閉じる">✕</button></div><p>期日が空欄のクエストです。タップして設定できます。</p><div id="missingList"></div></dialog><div id="notice" role="status" hidden></div><dialog id="fx" hidden role="dialog" aria-modal="true" aria-label="クエスト演出" tabindex="-1"><div class="impact-flash"></div><div class="impact-ring"></div><div class="ink-bloom"></div><div class="stamp" id="stamp"><img class="reference-seal" src="quest-clear.svg" alt="QUEST CLEAR" width="1920" height="1200"><svg class="seal-art" viewBox="0 0 600 390" aria-hidden="true"><defs><filter id="ink"><feTurbulence type="fractalNoise" baseFrequency=".07" numOctaves="3" seed="12" result="noise"/><feColorMatrix in="noise" type="luminanceToAlpha"/><feComponentTransfer><feFuncA type="discrete" tableValues="0 0 1 1 1"/></feComponentTransfer><feComposite in="SourceGraphic" operator="in"/></filter></defs><g fill="none" stroke="currentColor" filter="url(#ink)"><path stroke-width="9" d="M98 103 55 141 71 168 49 194 70 222 54 249 97 287H503L546 249 530 222 551 194 529 168 546 141 503 103Z"/><path stroke-width="3" d="M106 115 72 144 87 169 66 194 86 221 72 247 106 275H494L528 247 513 221 534 194 513 169 528 144 494 115Z"/><path stroke-width="6" d="M254 94 233 70 247 58 228 19 270 47 300 25 330 47 372 19 353 58 367 70 346 94M271 57 300 77 329 57M300 77V101M259 287 238 310 263 312 247 335 280 325 300 357 320 325 353 335 337 312 362 310 341 287"/><path stroke-width="5" d="M110 94 88 60 134 72 151 49 161 88M490 94 512 60 466 72 449 49 439 88M111 297 97 326 144 314 153 338 171 302M489 297 503 326 456 314 447 338 429 302"/><path stroke-width="3" d="M180 86H228M372 86H420M181 303H225M375 303H419"/></g><g fill="currentColor"><path d="m293 44 7-9 7 9-7 11zM112 176l-14 18 14 18 14-18zM488 176l-14 18 14 18 14-18z"/></g></svg><span class="seal-en" id="sealEn"></span><strong class="seal-jp" id="sealJp"></strong><span class="seal-caption">— HUNT COMPLETE —</span></div><p id="fxTitle"></p><small>タップして続ける</small></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),KEY='quest-log-v1';let state={version:1,tasks:[],settings:{effects:true,sound:false}},filter='open',editing=null,missingMode=false,fxTimer,noticeTimer;
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(valid(parsed))state=parsed;else throw Error('invalid')}}catch(e){setTimeout(()=>toast('保存データを読み込めません。元のデータは上書きせず、再読み込みをお試しください。'),100);state.readError=true}
function valid(s){return s&&s.version===1&&Array.isArray(s.tasks)&&s.tasks.length<=10000&&s.tasks.every(t=>t&&typeof t.id==='string'&&typeof t.title==='string'&&t.title.trim()&&typeof t.detail==='string'&&typeof t.comment==='string'&&typeof t.due==='string'&&(!t.due||/^\d{4}-\d{2}-\d{2}$/.test(t.due))&&['open','active','done'].includes(t.status))&&new Set(s.tasks.map(t=>t.id)).size===s.tasks.length&&s.settings&&typeof s.settings.effects==='boolean'&&typeof s.settings.sound==='boolean'}
function toast(t){$('notice').textContent=t;$('notice').hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').hidden=true,4500)}
function persist(){if(state.readError){toast('保存データを読み込めなかったため、上書きを停止しています。');return false}try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('保存できませんでした。JSONを書き出して保管してください。');return false}}
function days(t){if(!t.due)return Infinity;const now=new Date();return Math.round((new Date(t.due+'T00:00:00')-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000)}
function dueText(t){if(!t.due)return '期日未設定';const d=days(t);return t.due.replaceAll('-',' / ')+(t.status==='done'?'':d<0?' · '+Math.abs(d)+'日超過':d===0?' · 今日まで':d<=3?' · あと'+d+'日':'')}
function row(t){const r=document.createElement('div');r.className='row';const b=document.createElement('button');b.className='task';const strong=document.createElement('strong');strong.textContent=(t.status==='active'?'⚔ ':t.status==='done'?'✓ ':'')+t.title;const small=document.createElement('small');small.textContent=dueText(t);if(days(t)<=3&&t.status!=='done')small.className='urgent';b.append(strong,small);b.onclick=()=>edit(t.id);r.append(b);return r}
function render(){const open=state.tasks.filter(t=>t.status!=='done'),done=state.tasks.length-open.length;$('stats').replaceChildren();for(const [n,label]of[[open.length,'受付中'],[done,'達成']]){const span=document.createElement('span'),b=document.createElement('strong');b.textContent=n;span.append(b,label);$('stats').append(span)}const missing=open.filter(t=>!t.due);$('missing').hidden=!missing.length;$('missing').textContent='！ 期日が未設定のクエスト '+missing.length+'件 →';$('missingList').replaceChildren(...missing.map(row));const tasks=state.tasks.filter(t=>filter==='open'?t.status!=='done':t.status===filter).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));$('list').replaceChildren(...tasks.map(row));if(!tasks.length){const e=document.createElement('div');e.className='empty';const b=document.createElement('b');b.textContent=filter==='done'?'最初の達成を、ここに。':'次の冒険は、ここから。';const p=document.createElement('p');p.textContent=filter==='done'?'完了したクエストが並びます。':'タイトルだけで気軽に追加できます。';e.append(b,p);$('list').append(e)}document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter))}
function edit(id){editing=id;const t=state.tasks.find(x=>x.id===id);for(const k of['title','due','detail','comment'])$(k).value=t[k];$('start').hidden=t.status!=='open';$('complete').textContent=t.status==='done'?'未達成に戻す':'✓ 達成する';if($('missingDialog').open){missingMode=true;$('missingDialog').close()}$('editor').showModal()}
function saveFields(){const t=state.tasks.find(t=>t.id===editing);if(!$('title').value.trim()){toast('タイトルを入力してください');$('title').focus();return null}if(!$('due').checkValidity()){toast('期日を確認してください');return null}for(const k of['title','due','detail','comment'])t[k]=$(k).value.trim();return t}
function closeEdit(){ $('editor').close();render();if(missingMode){missingMode=false;if(state.tasks.some(t=>!t.due&&t.status!=='done'))$('missingDialog').showModal()}}
$('add').onclick=()=>{if(state.readError)return toast('保存データの読み込みエラーを解消してください。');const title=$('quickTitle').value.trim();if(!title)return $('quickTitle').focus();state.tasks.push({id:crypto.randomUUID(),title,due:'',detail:'',comment:'',status:'open',createdAt:new Date().toISOString()});persist();$('quickTitle').value='';render();toast('クエストを受注しました')};
$('quickTitle').onkeydown=e=>{if(e.key==='Enter')e.preventDefault()};
$('save').onclick=()=>{if(saveFields()){persist();closeEdit()}};$('closeEditor').onclick=closeEdit;$('editor').addEventListener('cancel',()=>{missingMode=false});
$('start').onclick=()=>{const t=saveFields();if(!t)return;t.status='active';persist();closeEdit();effect('QUEST START',t.title,'start')};$('complete').onclick=()=>{const t=saveFields();if(!t)return;const completed=t.status!=='done';t.status=completed?'done':'open';persist();closeEdit();if(completed)effect('QUEST CLEAR',t.title,'clear')};
$('delete').onclick=()=>{if(confirm('このクエストを削除しますか？')){state.tasks=state.tasks.filter(t=>t.id!==editing);persist();closeEdit()}};
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});$('missing').onclick=()=>$('missingDialog').showModal();$('closeMissing').onclick=()=>$('missingDialog').close();
$('settingsBtn').onclick=()=>{$('effects').checked=state.settings.effects;$('sound').checked=state.settings.sound;$('settings').showModal()};$('closeSettings').onclick=()=>$('settings').close();for(const k of['effects','sound'])$(k).onchange=()=>{state.settings[k]=$(k).checked;persist()};
let audioCtx,audioNodes=[];
function stopSound(){for(const node of audioNodes){try{node.stop()}catch(e){}}audioNodes=[]}
function playSound(type){if(!state.settings.sound)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();stopSound();const base=audioCtx.currentTime+.59;
function tone(f,at,len,vol,wave='triangle',end=f){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=wave;o.frequency.setValueAtTime(f,at);o.frequency.exponentialRampToValueAtTime(end,at+len);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+.015);g.gain.exponentialRampToValueAtTime(.0001,at+len);o.connect(g);g.connect(audioCtx.destination);o.start(at);o.stop(at+len+.02);audioNodes.push(o)}
tone(145,base,.38,.26,'sine',42);tone(76,base+.02,.55,.22,'triangle',30);
const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*.2,audioCtx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);const n=audioCtx.createBufferSource(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();n.buffer=buffer;f.type='lowpass';f.frequency.value=1700;g.gain.value=.2;n.connect(f);f.connect(g);g.connect(audioCtx.destination);n.start(base);audioNodes.push(n);
const notes=type==='clear'?[[293.66,0],[440,.16],[587.33,.32],[554.37,.58],[739.99,.76],[880,1.02]]:type==='start'?[[220,0],[329.63,.22],[440,.44]]:[[220,0],[220,.3]];for(const [hz,t]of notes){tone(hz,base+.18+t,.58,.08,'sawtooth');tone(hz/2,base+.18+t,.65,.08)}
}catch(e){}}
let previousFocus;function endFx(){clearTimeout(fxTimer);stopSound();$('fx').close();$('fx').hidden=true;document.body.classList.remove('impact');if(previousFocus?.isConnected)previousFocus.focus()}
function effect(label,title,type){if(!state.settings.effects){toast(type==='clear'?'達成！ おつかれさま！':type==='start'?'クエスト開始！':'期日が近いクエストがあります');return}previousFocus=document.activeElement;$('fx').dataset.kind=type;$('sealEn').textContent=label;$('sealJp').textContent=type==='clear'?'クエスト達成':type==='start'?'クエスト開始':'期日接近';$('stamp').querySelector('.seal-caption').textContent=type==='clear'?'— HUNT COMPLETE —':type==='start'?'— YOUR QUEST BEGINS —':'— TIME TO ACT —';$('fxTitle').textContent=title;$('fx').querySelectorAll('.spark').forEach(e=>e.remove());for(let i=0;i<36;i++){const s=document.createElement('i');s.className='spark';s.style.setProperty('--a',i*10+'deg');$('fx').append(s)}$('fx').hidden=false;if(!$('fx').open)$('fx').showModal();$('fx').getAnimations({subtree:true}).forEach(a=>{a.cancel();a.play()});document.body.classList.add('impact');$('fx').focus();playSound(type);clearTimeout(fxTimer);fxTimer=setTimeout(endFx,4900)}$('fx').onclick=endFx;$('fx').onkeydown=e=>{if(['Escape','Enter',' '].includes(e.key)){e.preventDefault();endFx()}if(e.key==='Tab'){e.preventDefault();$('fx').focus()}};$('preview').onclick=()=>effect('QUEST CLEAR','ひとつ達成。次の冒険へ。','clear');
$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='quest-log-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10000000)throw Error();const next=JSON.parse(await f.text());if(!valid(next))throw Error();if(confirm(next.tasks.length+'件のクエストで置き換えます。現在のJSONは書き出しましたか？')){state={version:1,tasks:next.tasks,settings:next.settings};persist();render();$('settings').close();toast('読み込みました')}}catch(e){toast('対応するJSONファイルではありません。データは変更していません。')}finally{$('importFile').value=''}};
render();const urgent=state.tasks.filter(t=>t.status!=='done'&&days(t)<=3);if(urgent.length)setTimeout(()=>effect('TIME TO QUEST',urgent.length+'件のクエストの期日が迫っています','warning'),500);
