<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予定との差・スマホ表示確認</title><link rel="stylesheet" href="../styles.css?v4=32&build=39"></head><body><main id="app"></main><script src="../core.js?v4=32&build=39"></script><script src="../list-ui.js?v4=32&build=39"></script><script src="../record-ui.js?v4=32&build=39"></script><script>
const app=document.getElementById('app');
if(!new URLSearchParams(location.search).has('sample')){app.innerHTML='<h1>予定との差：320 / 390 / 430px</h1><p>架空データのみ．保存データを読み書きしません．</p><div style="display:flex;gap:16px;overflow:auto">'+[320,390,430].map(w=>'<iframe id="phone'+w+'" title="'+w+'px" width="'+w+'" height="1000" src="?sample=1&v4=32&build=39" style="flex:none;border:1px solid #ccd8ca"></iframe>').join('')+'</div>';}
else{const U=window.MoneyV4,plan=[{id:'salary',kind:'income',name:'給料',amount:300000},{id:'food',kind:'expense',group:'生活費',subgroup:'食費',name:'食費',amount:120000}],row={status:'draft',values:{salary:{...plan[0],entered:true,amount:320000},food:{...plan[1],entered:true,amount:100000}}},r={plan,row,status:'draft',planned:U.vector(plan),actual:U.vector(Object.values(row.values))},money=n=>new Intl.NumberFormat('ja-JP').format(n)+'円';app.innerHTML='<h1>実際のお金を，記録する．</h1><div class="grid3">'+U.recordUI.metrics(r,money)+'</div><p class="hint">差は実績−予定です．入力途中は入力済み分と月全体の予定を比べます．</p>'+U.recordUI.render(plan,r,{esc:s=>String(s??''),money,entry:()=>'',button:()=>''});}
</script></body></html>
