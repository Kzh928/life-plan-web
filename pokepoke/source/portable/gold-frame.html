.comment-wrap{display:block;margin-top:11px;font-size:.79rem;color:#687894;font-weight:750}.comment{display:block;width:100%;min-height:56px;margin-top:5px;padding:10px;border:1px solid #d5e0ef;border-radius:9px;background:#fbfcff;color:#172747;font:inherit;font-size:.92rem;line-height:1.45;resize:vertical}.comment:focus{background:white}.settings{flex-wrap:wrap}.settings-main{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.card{padding:0;overflow:hidden}.card-head{margin:0}.card-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:68px;padding:15px 18px;background:white;border:0;border-radius:16px;text-align:left;color:#152846;font-size:1.08rem;font-weight:800;line-height:1.4}.card-toggle span:first-child{overflow-wrap:anywhere}.chevron{flex:none;color:#6d7e9d;font-size:1.4rem;font-weight:500;transition:transform .18s}.card.open .chevron{transform:rotate(90deg)}.card-body{padding:0 16px 17px;border-top:1px solid #edf1f8}.card-body[hidden]{display:none}.item-tools{display:flex;align-items:center;gap:8px;margin:12px 0}.item-tools .name{font-size:.95rem;min-height:42px;border-color:#d7e0ef;background:#fbfcff;padding:7px 10px}.item-tools .remove{flex:none}.cards{gap:9px}@media(min-width:700px){.card{padding:0}.card-body{padding:0 18px 18px}}@media(max-width:390px){.card-toggle{min-height:62px;padding:13px 15px}.card-body{padding:0 12px 14px}}.backup-panel{display:grid;gap:9px}.backup-panel h2{font-size:.98rem;margin:0}.backup-panel p{color:#5d6d89;font-size:.82rem;line-height:1.5;margin:0}.backup-buttons{display:flex;gap:8px;flex-wrap:wrap}.backup-buttons .btn{flex:1;min-width:145px}.backup-status{font-size:.82rem;min-height:1.2em;color:#245c3b}.backup-status.error{color:#b13349}.bar{flex-wrap:wrap}.bar-actions{display:flex;gap:8px;flex-wrap:wrap}.card-head{display:flex;align-items:center}.card-head .card-toggle{flex:1;min-width:0;width:auto}.row-order{display:flex;gap:4px;padding-right:10px;flex:none}.row-order[hi <header class="top"><h1 class="title">ポケポケ 金フレーム</h1></header>
<main class="shell">
<section class="panel"><label class="section-label" for="setPicker">セット</label><div class="set-line"><select id="setPicker" class="set-picker"></select><button class="btn primary" id="newSet" type="button">＋ 新規</button></div><div class="set-actions"><button class="btn" id="renameSet" type="button">名前を変更</button><button class="btn danger" id="deleteSet" type="button">セットを削除</button></div></section>
<section class="panel settings"><div class="settings-main"><div><strong id="columnCount">数値 3個</strong><small>このセットの数値の数</small></div><button class="btn" id="editLabels" type="button">数値名を編集</button></div><div class="settings-buttons"><button class="tiny" id="lessColumn" type="button" aria-label="数値を1個減らす">−</button><button class="tiny" id="moreColumn" type="button" aria-label="数値を1個増やす">＋</button></div></section>
<section class="panel backup-panel"><h2>データのバックアップ・復元</h2><p>この端末の全セット・項目・数値・コメント・並び順をJSONに保存できます．別の端末やGitHub版へ移すときは，書き出したファイルを読み込んでください．</p><div class="backup-buttons"><button class="btn" id="exportData" type="button">JSONを書き出す</button><button class="btn" id="importData" type="button">JSONを読み込む</button></div><input id="importFile" type="file" accept=".json,application/json" hidden><div class="backup-status" id="backupStatus" role="status" aria-live="polite"></div></section>
<div class="bar"><strong id="rowCount"></strong><div class="bar-actions"><button class="btn" id="reorderRows" type="button" aria-pressed="false">並び替え</button><button class="btn primary" id="addRow" type="button">＋ 行を追加</button></div></div><div id="cards" class="cards"></div><p class="hint">開いた項目はそのまま残ります．並び替えは名前の横の上下ボタンで変更できます．変更はこの端末に自動保存されます．</p>
</main>
<dialog id="entryDialog"><form id="entryForm" class="dialog-body"><h2 id="dialogTitle" class="dialog-title"></h2><div id="dialogFields"></div><div class="dialog-actions"><button class="btn" id="cancelDialog" type="button">キャンセル</button><button class="btn primary" type="submit">保存</button></div></form></dialog>
<script>
// セットと各行を端末に保存する。旧バージョンのデータも引き継ぐ。
const storageKey='pokepoke-number-sets-v2';const oldKey='pokepoke-number-memo-v1';const id=()=>typeof crypto.randomUUID==='function'?crypto.randomUUID():`${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
const defaultRows=()=>[];
function defaultState(rows=defaultRows()){const setId=id();return {active:setId,sets:[{id:setId,name:'最初のセット',columns:3,labels:['数値1','数値2','数値3'],rows}]}}
function validRow(row){return row&&typeof row.id==='string'&&typeof row.name==='string'&&Array.isArray(row.values)&&row.values.every(Number.isFinite)}
function load(){try{const value=JSON.parse(localStorage.getItem(storageKey));if(value&&Array.isArray(value.sets)&&value.sets.length&&value.sets.every(s=>typeof s.id==='string'&&typeof s.name==='string'&&Number.isInteger(s.columns)&&s.columns>=1&&Array.isArray(s.rows)&&s.rows.every(validRow))){value.sets.forEach(set=>{if(!Array.isArray(set.labels))set.labels=[];for(let i=0;i<set.columns;i++)if(typeof set.labels[i]!=='string')set.labels[i]=`数値${i+1}`;set.rows.forEach(row=>{if(typeof row.comment!=='string')row.comment=''})});return value}}catch(e){}try{const old=JSON.parse(localStorage.getItem(oldKey));if(Array.isArray(old)&&old.every(validRow))return defaultState(old)}catch(e){}return defaultState()}
let state=load();let mode='';let ordering=false;const $=selector=>document.querySelector(selector);const current=()=>state.sets.find(s=>s.id===state.active)||state.sets[0];
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch(e){$('.hint').textContent='保存できません．ブラウザーの保存設定を確認してください．'}}
function render(){const set=current();state.active=set.id;const picker=$('#setPicker');picker.replaceChildren();state.sets.forEach(s=>{const option=document.createElement('option');option.value=s.id;option.textContent=s.name||'名称未設定';picker.append(option)});picker.value=set.id;$('#columnCount').textContent=`数値 ${set.columns}個`;$('#lessColumn').disabled=set.columns===1;$('#deleteSet').disabled=state.sets.length===1;$('#rowCount').textContent=`${set.rows.length} 件`;const cards=$('#cards');cards.replaceChildren();if(!set.rows.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='行がありません．「行を追加」から登録できます．';cards.append(empty)}set.rows.forEach(row=>{const card=document.createElement('article');card.className='card';card.dataset.id=row.id;const toggle=document.createElement('button');toggle.type='button';toggle.className='card-toggle';const title=document.createElement('span');title.textContent=row.name||'名称未設定';const chevron=document.createElement('span');chevron.className='chevron';chevron.setAttribute('aria-hidden','true');chevron.textContent='›';const titleGroup=document.createElement('span');titleGroup.className='card-title-group';const leader=document.createElement('span');leader.className='max-label';function updateLeader(){const values=Array.from({length:set.columns},(_,i)=>row.values[i]??0),max=Math.max(...values);const labels=values.flatMap((value,i)=>value===max?[set.labels[i]||`数値${i+1}`]:[]);leader.hidden=values.every(value=>value===0);leader.textContent=labels.join('・');leader.setAttribute('aria-label',`最大の数値名：${labels.join('，')}`)}updateLeader();titleGroup.append(title,leader);toggle.append(titleGroup,chevron);toggle.setAttribute('aria-expanded',String(row.open===true));toggle.setAttribute('aria-label',`${row.name||'名称未設定'}の数値を${row.open===true?'閉じる':'開く'}`);const body=document.createElement('div');body.className='card-body';body.id=`details-${row.id}`;body.hidden=row.open!==true;toggle.setAttribute('aria-controls',body.id);card.classList.toggle('open',!body.hidden);toggle.addEventListener('click',()=>{const next=body.hidden;body.hidden=!next;card.classList.toggle('open',next);toggle.setAttribute('aria-expanded',String(next));toggle.setAttribute('aria-label',`${title.textContent}の数値を${next?'閉じる':'開く'}`);row.open=next;save()});const head=document.createElement('div');head.className='card-head';head.append(toggle);const order=document.createElement('div');order.className='row-order';order.hidden=!ordering;for(const [delta,text] of [[-1,'↑ 上へ'],[1,'↓ 下へ']]){const button=document.createElement('button');button.type='button';button.textContent=text;button.dataset.delta=String(delta);button.setAttribute('aria-label',`${row.name||'名称未設定'}を${delta<0?'上へ':'下へ'}`);button.addEventListener('click',()=>moveRow(row.id,delta));order.append(button)}head.append(order);card.append(head);const tools=document.createElement('div');tools.className='item-tools';const name=document.createElement('input');name.className='name';name.value=row.name;name.setAttribute('aria-label','項目名を変更');name.addEventListener('input',()=>{row.name=name.value;title.textContent=name.value||'名称未設定';save()});const remove=document.createElement('button');remove.type='button';remove.className='remove';remove.textContent='×';remove.setAttribute('aria-label',`${row.name||'名称未設定'}を削除`);remove.addEventListener('click',()=>{set.rows=set.rows.filter(r=>r.id!==row.id);save();render()});tools.append(name,remove);body.append(tools);const stats=document.createElement('div');stats.className='stats';for(let index=0;index<set.columns;index++){const stat=document.createElement('div');stat.className='stat';const label=document.createElement('span');label.className='stat-label';label.textContent=set.labels[index]||`数値${index+1}`;const control=document.createElement('div');control.className='control';const minus=document.createElement('button');minus.type='button';minus.className='tap';minus.textContent='−';minus.setAttribute('aria-label',`${row.name||'名称未設定'} 数値${index+1}を減らす`);const number=document.createElement('input');number.type='number';number.inputMode='numeric';number.step='1';number.className='number';number.value=row.values[index]??0;number.setAttribute('aria-label',`${row.name||'名称未設定'} 数値${index+1}`);const plus=document.createElement('button');plus.type='button';plus.className='tap plus';plus.textContent='＋';plus.setAttribute('aria-label',`${row.name||'名称未設定'} 数値${index+1}を増やす`);function step(delta){const value=Number(number.value);row.values[index]=(Number.isFinite(value)&&number.value!==''?value:row.values[index]??0)+delta;number.value=row.values[index];save();updateLeader()}minus.addEventListener('click',()=>step(-1));plus.addEventListener('click',()=>step(1));number.addEventListener('change',()=>{const value=Number(number.value);if(number.value.trim()===''||!Number.isFinite(value)){number.value=row.values[index]??0;return}row.values[index]=value;save();updateLeader()});number.addEventListener('input',()=>{const value=Number(number.value);if(number.value.trim()!==''&&Number.isFinite(value)){row.values[index]=value;save();updateLeader()}});control.append(minus,number,plus);stat.append(label,control);stats.append(stat)}body.append(stats);const commentWrap=document.createElement('label');commentWrap.className='comment-wrap';commentWrap.textContent='コメント';const comment=document.createElement('textarea');comment.className='comment';comment.rows=2;comment.placeholder='この項目のメモを入力';comment.value=row.comment||'';comment.setAttribute('aria-label',`${row.name||'名称未設定'}のコメント`);comment.addEventListener('input',()=>{row.comment=comment.value;save()});commentWrap.append(comment);body.append(commentWrap);card.append(body);cards.append(card)});updateOrderButtons()}
function updateOrderButtons(){const rows=current().rows;document.querySelectorAll('.card').forEach(card=>{const index=rows.findIndex(r=>r.id===card.dataset.id);card.querySelectorAll('.row-order button').forEach(button=>button.disabled=index+Number(button.dataset.delta)<0||index+Number(button.dataset.delta)>=rows.length)})}
function moveRow(rowId,delta){const rows=current().rows,index=rows.findIndex(r=>r.id===rowId),target=index+delta;if(index<0||target<0||target>=rows.length)return;const cards=Array.from(document.querySelectorAll('.card')),card=cards.find(c=>c.dataset.id===rowId),other=cards.find(c=>c.dataset.id===rows[target].id);const before=card.getBoundingClientRect().top;[rows[index],rows[target]]=[rows[target],rows[index]];if(delta<0)other.before(card);else other.after(card);save();updateOrderButtons();window.scrollBy(0,card.getBoundingClientRect().top-before)}
$('#reorderRows').addEventListener('click',()=>{ordering=!ordering;$('#reorderRows').setAttribute('aria-pressed',String(ordering));$('#reorderRows').textContent=ordering?'並び替え完了':'並び替え';document.querySelectorAll('.row-order').forEach(el=>el.hidden=!ordering);updateOrderButtons()});
const dialog=$('#entryDialog');function openDialog(type){mode=type;const fields=$('#dialogFields');fields.replaceChildren();const title=type==='row'?'行を追加':type==='set'?'新しいセット':type==='labels'?'数値名を編集':'セット名を変更';$('#dialogTitle').textContent=title;function field(label,value,typeName,name){const wrap=document.createElement('label');wrap.className='field';wrap.textContent=label;const input=document.createElement('input');input.name=name;input.type=typeName;input.required=true;input.value=value;if(typeName==='number'){input.inputMode='numeric';input.step='1'}wrap.append(input);return wrap}if(type==='row'){fields.append(field('名称','','text','name'));const grid=document.createElement('div');grid.className='dialog-grid';for(let i=0;i<current().columns;i++)grid.append(field(current().labels[i]||`数値${i+1}`,'0','number',`value${i}`));fields.append(grid);const note=field('コメント','','text','comment');note.querySelector('input').required=false;fields.append(note)}else if(type==='labels'){for(let i=0;i<current().columns;i++)fields.append(field(`数値${i+1}の名称`,current().labels[i]||`数値${i+1}`,'text',`label${i}`))}else fields.append(field('セット名',type==='rename'?current().name:'','text','name'));dialog.showModal();requestAnimationFrame(()=>fields.querySelector('input')?.focus())}
$('#entryForm').addEventListener('submit',event=>{event.preventDefault();const form=new FormData(event.currentTarget);const name=String(form.get('name')||'').trim();if(mode!=='labels'&&!name)return;if(mode==='row'){const set=current();const values=Array.from({length:set.columns},(_,i)=>Number(form.get(`value${i}`)));if(values.some(v=>!Number.isFinite(v)))return;const row={id:id(),name,values,comment:String(form.get('comment')||'')};set.rows.push(row);row.open=true;save();dialog.close();render();const added=Array.from(document.querySelectorAll('.card')).find(el=>el.dataset.id===row.id);added?.scrollIntoView({behavior:'smooth',block:'center'});added?.classList.add('flash')}else if(mode==='set'){const set={id:id(),name,columns:3,labels:['数値1','数値2','数値3'],rows:[]};state.sets.push(set);state.active=set.id;save();dialog.close();render();$('#addRow').focus()}else if(mode==='labels'){current().labels=Array.from({length:current().columns},(_,i)=>String(form.get(`label${i}`)||'').trim()||`数値${i+1}`);save();dialog.close();render()}else{current().name=name;save();dialog.close();render()}});
function backupStatus(message,error=false){const el=$('#backupStatus');el.textContent=message;el.classList.toggle('error',error)}
function downloadBackup(){const data={format:'pokepoke-gold-frame',version:1,exportedAt:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`pokepoke-gold-frame-${new Date().toISOString().slice(0,10)}.json`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);backupStatus('JSONを書き出しました．ファイルを安全な場所に保存してください．')}
function validateBackup(data){if(!data||data.format!=='pokepoke-gold-frame'||data.version!==1||!data.state||!Array.isArray(data.state.sets)||data.state.sets.length<1||data.state.sets.length>1000)throw Error('このアプリのバックアップ形式ではありません．');const copy=JSON.parse(JSON.stringify(data.state));const ids=new Set();for(const set of copy.sets){if(!set||typeof set.id!=='string'||!set.id||ids.has(set.id)||typeof set.name!=='string'||!Number.isInteger(set.columns)||set.columns<1||set.columns>50||!Array.isArray(set.labels)||set.labels.length!==set.columns||set.labels.some(x=>typeof x!=='string')||!Array.isArray(set.rows)||set.rows.length>100000)throw Error('セットの内容が正しくありません．');ids.add(set.id);const rowIds=new Set();for(const row of set.rows){if(!row||typeof row.id!=='string'||!row.id||rowIds.has(row.id)||typeof row.name!=='string'||typeof row.comment!=='string'||!Array.isArray(row.values)||row.values.length!==set.columns||row.values.some(x=>typeof x!=='number'||!Number.isFinite(x)))throw Error('項目・数値・コメントの内容が正しくありません．');rowIds.add(row.id)}}if(typeof copy.active!=='string'||!ids.has(copy.active))throw Error('選択中のセットが正しくありません．');return copy}
$('#exportData').addEventListener('click',downloadBackup);$('#importData').addEventListener('click',()=>$('#importFile').click());$('#importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{if(file.size>10*1024*1024)throw Error('10 MB以下のJSONを選んでください．');const next=validateBackup(JSON.parse(await file.text()));const count=next.sets.reduce((n,set)=>n+set.rows.length,0);if(!confirm(`${next.sets.length}セット・${count}項目を読み込みます．この端末の現在のデータを上書きします．必要なら先に「JSONを書き出す」でバックアップしてください．続けますか？`))return;localStorage.setItem(storageKey,JSON.stringify(next));state=next;render();backupStatus(`${next.sets.length}セット・${count}項目を復元しました．`)}catch(error){backupStatus(`読み込めませんでした：${error.message}`,true)}});
$('#cancelDialog').addEventListener('click',()=>dialog.close());$('#addRow').addEventListener('click',()=>openDialog('row'));$('#newSet').addEventListener('click',()=>openDialog('set'));$('#renameSet').addEventListener('click',()=>openDialog('rename'));$('#editLabels').addEventListener('click',()=>openDialog('labels'));$('#setPicker').addEventListener('change',e=>{state.active=e.target.value;save();render();window.scrollTo({top:0,behavior:'smooth'})});$('#moreColumn').addEventListener('click',()=>{const set=current();set.columns++;set.labels.push(`数値${set.columns}`);set.rows.forEach(row=>row.values.push(0));save();render()});$('#lessColumn').addEventListener('click',()=>{const set=current();if(set.columns<=1)return;if(!confirm(`数値${set.columns}を全行から削除しますか？`))return;set.columns--;set.labels.splice(set.columns,1);set.rows.forEach(row=>row.values.splice(set.columns,1));save();render()});$('#deleteSet').addEventListener('click',()=>{if(state.sets.length<=1)return;const set=current();if(!confirm(`「${set.name}」と中の行を削除しますか？`))return;state.sets=state.sets.filter(s=>s.id!==set.id);state.active=state.sets[0].id;save();render()});render();
</script></body></html>
