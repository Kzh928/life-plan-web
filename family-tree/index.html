<!doctype html>
<!-- ## 写真付き家系図．端末内保存・JSON受け渡し・左右を指定したドッキングに対応する． -->
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#24574b"><meta name="description" content="自分から広がる，ふたりでつなぐ写真付き家系図"><title>ふたりの家系図</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="./"><span class="mark">♧</span><span>ふたりの家系図<small>ROOTS & CONNECTIONS</small></span></a><span id="saveStatus" role="status">読み込み中…</span><button id="helpBtn" class="quiet">使い方</button></header>
<main><section class="intro"><div><p class="eyebrow">OUR FAMILY STORY</p><h1>自分から広がる，<br class="mobile">ふたりでつなぐ．</h1><p>写真と関係を残して，少しずつ育てる家系図．</p></div><button class="primary" id="addBtn">＋ 人物を追加</button></section>
<nav class="tools" aria-label="家系図の操作"><div class="tabs"><button class="active" id="treeTab">家系図</button><button id="listTab">人物一覧 <span id="count"></span></button></div><div class="actions"><button id="relationBtn">2人の関係</button><button id="dataBtn">データ・ドッキング</button></div></nav>
<section id="treeSection"><div class="canvasHead"><span><i class="dot"></i> <span id="centerLabel">自分が中心</span></span><span class="hint">人物をタップして編集 ／ 長押しで移動</span></div><div id="viewport" aria-label="家系図．指で移動，2本指で拡大縮小"><div id="world"><svg id="lines" aria-hidden="true"></svg><div id="nodes"></div></div><div class="zoom"><button id="zoomOut" aria-label="縮小">−</button><button id="fitBtn">全体</button><button id="centerBtn">中心</button><button id="zoomIn" aria-label="拡大">＋</button></div><div class="legend"><span>― 親子</span><span class="pink">― パートナー</span><span>┄ その他</span></div></div><p class="canvasFoot">人物から「親・子・きょうだい・パートナー」を追加できます．<button id="layoutBtn" class="textBtn">配置を整える</button></p></section>
<section id="listSection" hidden><input id="search" type="search" placeholder="名前・メモで検索" aria-label="人物を検索"><div id="peopleList"></div></section>
<footer>写真も名前も，この端末のブラウザ内に保存．<br>「データ」から写真入りのバックアップを残せます．<span>v1.0 · ChatGPTログイン不要</span></footer>
</main><dialog id="modal"><div id="modalContent"></div></dialog><div id="toast" role="status"></div>
<script src="core.js"></script><script src="app.js"></script></body></html>
